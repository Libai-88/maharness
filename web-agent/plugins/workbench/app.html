/* ---------- 昨天没做完 → 自动带到今天 ---------- */
/* 十二时辰：给日期添一点古意 */
const SHICHEN = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const shichen = d => SHICHEN[Math.floor(((d.getHours() + 1) % 24) / 2)] + '时';
function rollover() {
  const t = TODAY();
  if (S.meta.lastOpen === t) return 0;
  let n = 0;
  S.tasks.forEach(k => {
    if (!k.done && k.due && k.due < t) { k.rolls = (k.rolls || 0) + 1; k.carried = t; k.updatedAt = Date.now(); n++; }
  });
  S.meta.lastOpen = t;
  save(true);
  return n;
}

/* ---------- 派生数据 ---------- */
/* 在办：未完成且未取消。已取消的任务留在清单里但退出所有「待处理」统计，
   否则它会一直挂在逾期里，逼你去处理一件已经放弃的事 */
const live = k => !k.done && k.status !== 'cancel';
const overdue  = () => S.tasks.filter(k => live(k) && k.due && k.due < TODAY()).sort((a,b) => (a.due > b.due ? 1 : -1) || a.prio - b.prio);
const stuck    = () => S.projects.filter(p => p.status === 'blocked');
const todayList = () => {
  const t = TODAY();
  /* 入「今天」的条件（未完成）：无任何日期、已到截止日，或已到开始日（持续性任务一旦开始就留在今天，不再藏进未来）
     完成今日的仍按完成时间归入当天 */
  return S.tasks.filter(k => (live(k) && (!k.due || k.due <= t || (k.start && k.start <= t))) || (k.done && k.doneAt && ds(new Date(k.doneAt)) === t))
    .sort((a,b) => (a.done - b.done) || (a.prio - b.prio) || ((a.due||'9') > (b.due||'9') ? 1 : -1));
};
const allTags = () => { const m = {}; S.notes.forEach(n => (n.tags||[]).forEach(x => m[x] = (m[x]||0)+1)); return Object.entries(m).sort((a,b) => b[1]-a[1]); };

/* 未来任务：截止日在今天之后、且未开始（开始日 <= 今天的持续性任务归「今天」，不在这里） */
const upcoming = () => {
  const t = TODAY();
  return S.tasks.filter(k => live(k) && k.due && k.due > t && !(k.start && k.start <= t))
    .sort((a,b) => ((a.start || a.due) > (b.start || b.due) ? 1 : (a.start || a.due) < (b.start || b.due) ? -1 : 0) || (a.prio - b.prio));
};
/* 没有截止日的任务 */
const someday = () => S.tasks.filter(k => live(k) && !k.due).sort((a,b) => a.prio - b.prio);
/* 项目关联 */
const projById = id => S.projects.find(p => p.id === id);
const projName = id => { const p = projById(id); return p ? p.name : ''; };
const tasksOfProj = id => S.tasks.filter(k => k.pid === id);
const projProgress = id => {
  const arr = tasksOfProj(id);
  const done = arr.filter(k => k.done).length;
  return { done, total: arr.length, pct: arr.length ? Math.round(done / arr.length * 100) : 0,
           open: arr.filter(k => !k.done), od: arr.filter(k => !k.done && k.due && k.due < TODAY()) };
};
/* 按日期把任务分组，返回 [[日期, [任务...]], ...] */
const groupByDue = arr => {
  const m = new Map();
  arr.forEach(k => { const d = k.due || ''; if (!m.has(d)) m.set(d, []); m.get(d).push(k); });
  return [...m.entries()];
};

/* ---------- 今日负荷：把预估汇总起来，回答「今天排得下吗」 ----------
   est 的原生单位是番茄，小时数按当前番茄时长折算，仅用于给人看的副标。
   daily 取近 14 个自然日里有专注记录的天数做平均——没有记录的日子不该拉低产能基准。 */
const estHours = p => Math.round(p * (Number(ui.pomoMin) || 25) / 60 * 10) / 10;
function todayLoad() {
  const t = TODAY(), log = S.meta.pomoLog || {};
  const open = todayList().filter(k => !k.done && k.status !== 'cancel');
  const est = open.reduce((n, k) => n + (Number(k.est) || 0), 0);
  const doneP = Number(log[t]) || 0;
  const hist = [];
  for (let i = 1; i <= 14; i++) { const d = shift(t, -i); const c = Number(log[d]) || 0; if (c) hist.push(c); }
  const daily = hist.length ? Math.round(hist.reduce((a, b) => a + b, 0) / hist.length * 10) / 10 : 0;
  return { open, est, doneP, daily };
}
/* 挪期建议：从「优先级最低、预估最大」的非逾期任务里挑，凑够超出量就停，最多 3 项 */
function loadAdvice(L) {
  if (!L.est) return { kind: 'noest' };
  if (!L.daily) return { kind: 'nohist' };
  const surplus = L.est - L.daily;
  if (surplus <= 0) return { kind: 'fit' };
  const cand = L.open.filter(k => k.est && !(k.due && k.due < TODAY()))
    .sort((a, b) => (b.prio - a.prio) || ((b.est || 0) - (a.est || 0)));
  const pick = [], seen = new Set();
  let got = 0;
  for (const k of cand) {
    if (got >= surplus || pick.length >= 3 || seen.has(k.id)) continue;
    pick.push(k); seen.add(k.id); got += k.est;
  }
  return pick.length ? { kind: 'move', pick, after: L.est - got } : { kind: 'full' };
}
function loadCard() {
  const L = todayLoad();
  if (!L.open.length) return '';
  const head = `<div class="load-h"><span class="load-t">${T('loadTitle')}</span>
      <span class="load-s">${T('loadSub', L.open.length, L.est, estHours(L.est))}</span></div>`;
  if (!L.est) return `<div class="load">${head}<div class="load-note">${T('loadNoEst')}</div></div>`;
  const a = loadAdvice(L);
  const done = Math.min(L.doneP, L.est), left = Math.max(0, L.est - done);
  const within = Math.min(left, Math.max(0, L.daily - done));
  const over = Math.max(0, left - within);
  const total = Math.max(L.est, L.daily, 1);
  const bar = `<div class="load-bar">
      <span class="lb-d" style="width:${(done / total * 100).toFixed(1)}%"></span>
      <span class="lb-w" style="width:${(within / total * 100).toFixed(1)}%"></span>
      <span class="lb-o" style="width:${(over / total * 100).toFixed(1)}%"></span></div>
    <div class="load-legend">
      <span class="lg-d">${T('loadDone', estHours(done))}</span>
      <span class="lg-w">${T('loadLeft', left)}</span>
      ${over ? `<span class="lg-o">${T('loadOver', Math.round(over * 10) / 10)}</span>` : ''}</div>`;
  let line;
  if (a.kind === 'nohist') line = T('loadNoHist', L.est);
  else if (a.kind === 'fit') line = T('loadFit', L.est, L.daily);
  else if (a.kind === 'move') line = T('loadAdvice', L.est, L.daily, a.pick.map(k => k.title).join(LANG === 'en' ? ', ' : '、'), a.after);
  else line = T('loadAdviceFull', L.est, L.daily);
  const act = a.kind === 'move'
    ? `<button class="btn btn-sm" data-act="load-move" data-ids="${a.pick.map(k => k.id).join(',')}">${I.fwd}${T('loadApply', a.pick.length)}</button>
       <button class="btn btn-sm" data-act="go" data-to="tasks">${T('loadSelf')}</button>` : '';
  return `<div class="load">${head}${bar}<div class="load-note">${line}</div>${act ? `<div class="load-act">${act}</div>` : ''}</div>`;
}

const REPEAT = { daily: () => T('rptDaily'), weekly: () => T('rptWeekly'), monthly: () => T('rptMonthly'), weekdays: () => T('rptWeekdays') };
function nextDue(due, rpt) {
  const base = due || TODAY();
  if (rpt === 'daily') return shift(base, 1);
  if (rpt === 'weekly') return shift(base, 7);
  if (rpt === 'weekdays') {
    let n = shift(base, 1);
    while ([0, 6].includes(new Date(n + 'T00:00:00').getDay())) n = shift(n, 1);
    return n;
  }
  if (rpt === 'monthly') {
    const d = new Date(base + 'T00:00:00'), day = d.getDate();
    d.setMonth(d.getMonth() + 1);
    if (d.getDate() !== day) d.setDate(0);   // 月末钳位（1/31 → 2/28）
    return ds(d);
  }
  return base;
}

  S.tasks.unshift({ id: uid(), title: k.title, prio: k.prio, due: nd, done: false, pid: k.pid,

    /* 备注与预估属于任务本身的性质，跟着走；状态重置为未开始（新实例是一轮新的执行） */
    note: k.note || '', est: Number(k.est) || 0, status: 'todo' });

/* 某天该做的事 = 截止日当天，或落在起止区间内的每一天。
   跨度超过 31 天的长任务只在截止日出现，免得一条任务铺满整条时间轴 */
const TL_SPAN_MAX = 31;
const tlOnDay = (k, d) => {
  if (k.due === d) return true;
  if (!k.start || !k.due) return false;
  if (d < k.start || d > k.due) return false;
  return dayDiff(k.start, k.due) <= TL_SPAN_MAX;
};
function vTasksTimeline() {

    `<div class="tl-col${cls}"${key !== null ? ` data-drop="${key}"` : ''}><div class="tl-h">${hd}${sub !== '' ? `<span class="d2">${sub}</span>` : ''}</div>
     <div class="kb-cards">${tasks.length ? kbSort(tasks).map(k => kbCard(k, true)).join('') : `<div class="kb-empty">—</div>`}</div></div>`;
  let out = `<div class="viewhint">${T('tlHint')}</div><div class="tl">`;
  out += lane(null, ' rod', T('tlOverdue'), String(od.length), od);
  for (let i = 0; i < 14; i++) {
    const d = shift(t, i);
    out += lane('due:' + d, d === t ? ' today' : '', i === 0 ? T('dToday') : d.slice(5).replace('-', '/'),
      WD[new Date(d + 'T00:00:00').getDay()], open.filter(k => tlOnDay(k, d)));
  }
  out += lane('due:', '', T('tlNoDate'), '', open.filter(k => !k.due));
  return out + '</div>';
}
  /* 拖拽落点 → 改字段（看板=优先级/项目/标签，四象限=优先级，时间轴=截止日） */
  function applyDrop(drop, id) {
    const k = tById(id); if (!k || !drop) return;
    const i = drop.indexOf(':'), f = drop.slice(0, i), v = drop.slice(i + 1);
    if (f === 'prio' && Number(k.prio) !== Number(v)) { k.prio = Number(v); k.updatedAt = Date.now(); save(); render(); }
    else if (f === 'pid' && k.pid !== v) {

      save(); render(); if (p) toast(T('tAddedTo', p.name));

    else if (f === 'tag') {
      k.tags = k.tags || [];
      if (!v) { if (k.tags.length) { k.tags = []; k.updatedAt = Date.now(); save(); render(); } return; }
      const j = k.tags.indexOf(v);
      if (j < 0) { k.tags.push(v); if (k.tags.length > 6) k.tags.shift(); k.updatedAt = Date.now(); save(); render(); }
    }
    else if (f === 'due' && v !== '__none__' && k.due !== v) {
      k.due = v;
      // 拖到开始日之前 → 起止区间不再成立，清掉开始日（卡片上的区间标记会同步消失，看得见）
      if (k.start && k.start > v) k.start = '';

/* 月历视图：整月看安排；双击空白格在那一天加任务，拖动任务到别的格子改截止日 */
function vTasksMonth() {
  const base = new Date();
  base.setDate(1); base.setMonth(base.getMonth() + (ui.monthOff || 0));
  const y = base.getFullYear(), m = base.getMonth(), t = TODAY();
  const vis = scopeFiltered(S.tasks);   // 范围筛选（项目/标签/关键词）与列表共用
  const startIdx = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一为一周起点
  const dim = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startIdx; i++) cells.push('<div class="cal-cell mut"></div>');
  for (let d = 1; d <= dim; d++) {
    const dstr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const tk = vis.filter(k => k.due === dstr);
    cells.push(`<div class="cal-cell${dstr === t ? ' today' : ''}" data-cell="${dstr}" data-drop="due:${dstr}"><div class="cd">${d}${tk.length ? `<span>${tk.length}</span>` : ''}</div>

  }

  return `<div class="viewhint" style="margin-bottom:10px">${T('mHint')}</div><div class="cal-nav">

   纯函数（只读 S 与 ui），视图与「全选」共用同一份结果，避免两处逻辑走偏 */
/* 范围筛选：项目 / 标签 / 关键词。列表与看板、四象限、时间轴、月历共用同一套——
   用户在列表里选定的范围，切到其他视图后不被悄悄丢掉。
   tab（今天/逾期/即将到来/全部/已完成）仍只属于列表视图：看板等是全量未完成
   任务的优先级排布，按 tab 切会破坏「拖动改优先级」的语义 */
function scopeFiltered(arr) {
  const pf = ui.projFilter;
  if (pf === '__none') arr = arr.filter(k => !k.pid);
  else if (pf) arr = arr.filter(k => k.pid === pf);
  if (ui.taskTag) arr = arr.filter(k => (k.tags || []).includes(ui.taskTag));
  const q = ui.taskQ.trim().toLowerCase();
  if (q) arr = arr.filter(k => String(k.title || '').toLowerCase().includes(q)
    || (k.tags || []).some(x => String(x).toLowerCase().includes(q))
    || String(projName(k.pid) || '').toLowerCase().includes(q)
    || (k.subs || []).some(s => String(s.t || '').toLowerCase().includes(q))
    || String(k.link || '').toLowerCase().includes(q));
  return arr;
}

/* 已完成按完成日期分组：当天完成的归到当天，跨天回看有结构 */
function doneGroupedList(arr) {
  const m = new Map();
  arr.forEach(k => {
    const d = k.doneAt ? ds(new Date(k.doneAt)) : '—';
    if (!m.has(d)) m.set(d, []);
    m.get(d).push(k);

  return [...m.entries()].map(([d, ks]) => {
    const wd = d === '—' ? '' : WD[new Date(d + 'T00:00:00').getDay()];
    return `<div class="dgroup">

  const fire = (el, fn) => { if (el) el.onchange = () => { const v = el.value; el.value = ''; if (v) fn(v); }; };
  fire($('bbPrio'), v => batchSet('prio', v));

/* 批量改字段：prio / due / pid。改完保留勾选，方便接着改下一项 */
function batchSet(field, val) {
  const ks = ui.sel.map(tById).filter(Boolean);
  if (!ks.length) { toast(T('tSelEmpty'), true); return; }
  const touch = id => { const p = projById(id); if (p) p.updatedAt = Date.now(); };
  ks.forEach(k => {
    if (field === 'prio') k.prio = Number(val);
    else if (field === 'due') k.due = val === '__none__' ? '' : val;
    else if (field === 'pid') {
      if (val === '__none__') { if (k.pid) touch(k.pid); k.pid = ''; }
      else if (k.pid !== val) { if (k.pid) touch(k.pid); touch(val); k.pid = val; }
    }
    k.updatedAt = Date.now();
  });
  save(true);
  if (field === 'prio') toast(T('tBatchPrio', ks.length));
  else if (field === 'due') toast(T('tBatchDue', ks.length));
  else if (val === '__none__') toast(T('tBatchProjOff', ks.length));
  else toast(T('tBatchProj', ks.length, projName(val)));
  render();
}

/* ---------- 导出工具：Markdown 周报 / 全量 Markdown / 剪贴板 ---------- */
function downloadText(name, text) {
  const b = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true).catch(() => fallback());
  return Promise.resolve(fallback());
}
/* 周期报告：默认取复盘页当前周期（周或月），也可显式传入起止日期 */
function buildWeekMd(s0, e0) {
  const P = revPeriod();
  const ws = s0 || P.s, we = e0 || P.e;
  const inW = ts => { const d = ds(new Date(ts)); return d >= ws && d <= we; };
  const done = S.tasks.filter(k => k.done && k.doneAt && inW(k.doneAt)).sort((a,b) => a.doneAt - b.doneAt);
  const created = S.tasks.filter(k => k.createdAt && inW(k.createdAt));
  const blocked = stuck();
  const diary = Object.entries(S.diary).filter(([d]) => d >= ws && d <= we).sort();
  const zh = LANG !== 'en';
  const mdT = ui.revRange === 'month' ? T('mdM') : T('mdW');
  const L = zh
    ? { t: mdT, done: '本周期完成', new: '本周期新建', blk: '卡点', pomo: '专注番茄', diary: '每日一记', no: '（无）', none: '未关联项目', next: '下一步：' }
    : { t: mdT, done: 'Completed this period', new: 'Created this period', blk: 'Blockers', pomo: 'Pomodoros', diary: 'Daily lines', no: '(none)', none: 'Unlinked', next: 'Next: ' };
  let md = `# ${L.t}（${ws} ~ ${we}）\n\n`;
  md += `- ${L.done}：${done.length}\n- ${L.new}：${created.length}\n- ${L.blk}：${blocked.length}\n- ${L.pomo}：${pomoIn(ws, we)}\n\n`;
  md += `## ${L.done}\n\n`;
  if (done.length) {
    /* 完成明细按项目归组，一眼看清精力落点 */
    const byP = {};
    done.forEach(k => {
      const key = k.pid && projById(k.pid) ? projName(k.pid) : L.none;
      if (!byP[key]) byP[key] = [];
      byP[key].push(k);
    });
    Object.entries(byP).forEach(([pn, ks]) => {
      md += `- **${pn}**\n` + ks.map(k => `  - [x] ${k.title}`).join('\n') + '\n';
    });
  } else md += L.no + '\n';
  md += `\n## ${L.new}\n\n${created.length ? created.map(k => `- ${k.title}`).join('\n') : L.no}\n\n`;
  if (blocked.length) md += `## ${L.blk}\n\n${blocked.map(p => `- **${p.name}**：${p.blocker || L.no}${p.next ? ` · ${L.next}${p.next}` : ''}`).join('\n')}\n\n`;
  if (diary.length) md += `## ${L.diary}\n\n${diary.map(([d, v]) => `- **${d}** ${v}`).join('\n')}\n\n`;
  return md;
}
function buildAllMd() {
  const zh = LANG !== 'en';
  const pomoTotal = Object.values(S.meta.pomoLog || {}).reduce((a, b) => a + (Number(b) || 0), 0);
  let md = `# ${T('appName')}\n\n> ${TODAY()}\n\n`;

    if ((k.subs || []).length) line += '\n' + k.subs.map(s => `  - [${s.d ? 'x' : ' '}] ${s.t}`).join('\n');

}
function heatCells() {
  const days = 119, counts = {};
  S.tasks.forEach(k => { if (k.done && k.doneAt) { const d = ds(new Date(k.doneAt)); counts[d] = (counts[d] || 0) + 1; } });

}
function memoryCard() {
  const t = new Date(), md = `${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  const year = t.getFullYear();
  const de = Object.entries(S.diary).filter(([d]) => d.slice(5) === md && Number(d.slice(0, 4)) < year).sort().reverse();
  let item = de[0] ? { date: de[0][0], text: de[0][1] } : null;

      return x.getMonth() === t.getMonth() && x.getDate() === t.getDate() && x.getFullYear() < year; })
      .sort((a,b) => b.createdAt - a.createdAt);

  return `<div class="memory"><span>${T('memTitle')} · ${item.date}</span>${esc(item.text.slice(0, 72))}</div>`;

/* 复盘周期：按周或按月，同时给出等长的上一周期用于环比 */
function revPeriod() {
  if (ui.revRange === 'month') {
    const b = new Date(); b.setDate(1); b.setMonth(b.getMonth() + (ui.revMonthOff || 0));
    const y = b.getFullYear(), m = b.getMonth();
    const s = `${y}-${String(m + 1).padStart(2, '0')}-01`, e = ds(new Date(y, m + 1, 0));
    const py = m === 0 ? y - 1 : y, pm = m === 0 ? 11 : m - 1;   // 跨年：1 月的上月是去年 12 月
    return { s, e, ps: `${py}-${String(pm + 1).padStart(2, '0')}-01`, pe: ds(new Date(py, pm + 1, 0)),
             label: T('revMonthNav', y, m + 1) };
  }
  const ws = weekStart(TODAY(), ui.weekOff), we = shift(ws, 6);
  return { s: ws, e: we, ps: shift(ws, -7), pe: shift(ws, -1),
           label: ui.weekOff === 0 ? T('wThis') : ui.weekOff === -1 ? T('wLast') : T('wThat', ws.slice(5)) };
}
/* 连续达成：每天至少完成 1 项。今天还没完成不算断，从昨天起算 */
function streakInfo() {
  const set = new Set();
  S.tasks.forEach(k => { if (k.done && k.doneAt) set.add(ds(new Date(k.doneAt))); });
  if (!set.size) return { cur: 0, best: 0 };
  let cur = 0, d = TODAY();
  if (!set.has(d)) d = shift(d, -1);
  while (set.has(d)) { cur++; d = shift(d, -1); }
  let best = 0, run = 0, prev = null;
  [...set].sort().forEach(x => { run = (prev && shift(prev, 1) === x) ? run + 1 : 1; if (run > best) best = run; prev = x; });
  return { cur, best };
}
/* 周期内完成的番茄数（读每日番茄账本） */
const pomoIn = (s, e) => Object.entries(S.meta.pomoLog || {})
  .filter(([d]) => d >= s && d <= e).reduce((n, [, c]) => n + (Number(c) || 0), 0);
/* 环比单元格：提升用 accent、下降用 warn、持平中性（与涨跌无关，只看好坏） */
function cmpCell(label, cur, prev) {
  const diff = cur - prev;
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  const txt = diff > 0 ? T('cmpUp', diff) : diff < 0 ? T('cmpDown', Math.abs(diff)) : T('cmpFlat');
  return `<div class="cmp"><div class="cl">${esc(label)}</div><div class="cv">${cur}</div><div class="cd ${cls}">${txt}</div></div>`;
}
/* 每日完成趋势：内联 SVG 手写，不引任何图表库。完成量实线 + 番茄投入虚线（同一比例尺） */
function trendChart(s, e) {
  const counts = {}, pomos = {};
  S.tasks.forEach(k => {
    if (k.done && k.doneAt) { const d = ds(new Date(k.doneAt)); if (d >= s && d <= e) counts[d] = (counts[d] || 0) + 1; }
  });
  Object.entries(S.meta.pomoLog || {}).forEach(([d, c]) => { if (d >= s && d <= e) pomos[d] = Number(c) || 0; });
  const days = [];
  let d = s, guard = 0;
  while (d <= e && guard++ < 400) { days.push({ d, v: counts[d] || 0, p: pomos[d] || 0 }); d = shift(d, 1); }
  if (!days.length) return '';
  const W = 660, H = 150, padL = 26, padR = 10, padT = 14, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const mx = Math.max(1, ...days.map(x => Math.max(x.v, x.p)));
  const X = i => days.length === 1 ? padL + iw / 2 : padL + i * iw / (days.length - 1);
  const Y = v => padT + ih - (v / mx) * ih;
  const grid = [0, mx / 2, mx].map(v =>
    `<line class="gl" x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W - padR}" y2="${Y(v).toFixed(1)}"/>
     <text class="ax" x="${padL - 6}" y="${(Y(v) + 3.4).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`).join('');
  const line = days.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(x.v).toFixed(1)}`).join(' ');
  const lineP = days.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(x.p).toFixed(1)}`).join(' ');
  const area = `${line} L${X(days.length - 1).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const step = days.length <= 10 ? 1 : days.length <= 20 ? 2 : 5;
  const labels = days.map((x, i) => (i % step === 0 || i === days.length - 1)
    ? `<text class="ax" x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${Number(x.d.slice(8))}</text>` : '').join('');
  const dots = days.map((x, i) =>
    `<circle class="dot${x.v ? '' : ' z'}" cx="${X(i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="${x.v ? 3 : 1.8}"><title>${x.d} · ${x.v}</title></circle>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('revTrend'))}">
    <defs>
      <linearGradient id="trendStroke" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0e93b5"/></linearGradient>
      <linearGradient id="trendArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0e8b80" stop-opacity=".18"/><stop offset="1" stop-color="#0e8b80" stop-opacity="0"/></linearGradient>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#trendArea)" stroke="none"/>
    <path class="ln" d="${line}"/>
    <path class="ln2" d="${lineP}"/>
    ${dots}${labels}</svg>`;
}

/* ---------- 复盘归因洞察：数字人人会看，结论才是价值 ----------
   只在本周期有足够证据时才输出；触发条件不满足的结论整条跳过，宁缺毋滥 */
function reviewInsights() {
  const P = revPeriod();
  const inR = (a, b) => ts => { const d = ds(new Date(ts)); return d >= a && d <= b; };
  const inCur = inR(P.s, P.e);
  const outs = [];
  const doneArr = S.tasks.filter(k => k.done && k.doneAt && inCur(k.doneAt));
  const od = overdue(), p1Now = od.filter(k => k.prio === 1), waitNow = od.filter(k => k.status === 'wait');
  /* 逾期里有没有「等待中」：等待中 = 卡外部依赖；否则 = 排期问题。这是两种不同的解法 */
  if (od.length) outs.push(waitNow.length ? T('insWait', waitNow.length) : T('insWaitNone', od.length));
  /* 当前 P1 逾期平均滞留天数 */
  if (p1Now.length) {
    const avg = Math.round(p1Now.reduce((n, k) => n + (-dayDiff(TODAY(), k.due)), 0) / p1Now.length * 10) / 10;
    outs.push(T('insStaleNow', p1Now.length, avg));
  }
  /* 本周期完成的 P1 里，晚于截止日的平均晚几天（做完但拖了） */
  const slipped = doneArr.filter(k => k.prio === 1 && k.due && k.due < ds(new Date(k.doneAt)));
  if (slipped.length) {
    const avg = Math.round(slipped.reduce((n, k) => n + dayDiff(k.due, ds(new Date(k.doneAt))), 0) / slipped.length * 10) / 10;
    outs.push(T('insStale', avg));
  }
  /* 高效工作日 + 完成是否扎堆 */
  if (doneArr.length >= 3) {
    const wc = [0, 0, 0, 0, 0, 0, 0];
    doneArr.forEach(k => wc[new Date(k.doneAt).getDay()]++);
    const best = wc.indexOf(Math.max(...wc));
    outs.push(T('insBestDay', WD[best], wc[best]));
    const srt = wc.slice().sort((a, b) => b - a);
    const pct = Math.round((srt[0] + srt[1]) / doneArr.length * 100);
    if (pct >= 60 && doneArr.length >= 5) outs.push(T('insConcen', pct, WD[best]));
  }
  /* 预估准确率：只有「本周期完成且填过预估」的任务参与，填得越多越接近真实 */
  const estT = doneArr.filter(k => k.est > 0);
  if (estT.length >= 3) {
    const estSum = estT.reduce((n, k) => n + Number(k.est), 0), actSum = estT.reduce((n, k) => n + (Number(k.pomo) || 0), 0);
    outs.push(T('insEst', Math.min(300, Math.round(actSum / estSum * 100))));
  }
  return outs;
}

/* ---------- 弹层可访问性 ----------
   统一挂载口：补 role=dialog / aria-modal / aria-labelledby，加 Tab 焦点陷阱，
   关闭后把焦点还给打开它的元素。此前各弹层各写一套、且完全没有焦点管理，
   键盘用户 Tab 会跑到弹层背后的页面上去。 */
let lastFocus = null;
const FOCUSABLE = 'button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
function mountModal(m) {
  lastFocus = document.activeElement;
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  const h3 = m.querySelector('h3');
  if (h3) { if (!h3.id) h3.id = 'mdlTitle'; m.setAttribute('aria-labelledby', h3.id); }
  m.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const els = Array.prototype.slice.call(m.querySelectorAll(FOCUSABLE));
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.body.appendChild(m);
  return m;
}
function unmountModal(m) {
  if (!m) return;
  m.remove();
  if (lastFocus && document.body.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} }
  lastFocus = null;
}

/* toast：单条置换（不堆叠），可带「撤销」动作按钮 */
function toast(msg, opts) {
  const o = typeof opts === 'boolean' ? { err: opts } : (opts || {});
  const box = $('toasts');
  if (!o.keep) [...box.children].forEach(el => el.remove());
  const d = document.createElement('div');
  d.className = 'toast' + (o.err ? ' err' : '');
  d.innerHTML = (o.err ? I.alert : '') + `<span>${esc(msg)}</span>` +
    (o.action ? `<button type="button" class="undo" data-undo="1">${esc(o.action.label)}</button>` : '');
  box.appendChild(d);
  if (o.action) d.querySelector('[data-undo]').onclick = () => { d.remove(); o.action.fn(); };
  setTimeout(() => {
    d.style.transition = 'opacity .3s,transform .3s'; d.style.opacity = 0; d.style.transform = 'translateY(6px)';
    setTimeout(() => d.remove(), 320);
  }, o.err ? 3400 : 4600);
}
/* 可撤销删除：先执行，后给撤销入口（人文界面：不用确认框打断） */
/* 会话级撤销：撤销入口不随 toast 一起消失——记在 lastUndo 上，
   toast 关掉后仍可通过 Ctrl/⌘+Z 或命令面板「撤销：xxx」再撤一次。
   撤销时同时把删除产生的回收站记录截断回去，避免「撤销完回收站里还留着一份」。 */
let lastUndo = null;
function undoable(label, mutate) {
  const binLen = Array.isArray(S.bin) ? S.bin.length : 0;
  const restore = mutate();
  const run = () => {
    if (Array.isArray(S.bin) && S.bin.length > binLen) S.bin.length = binLen;
    restore(); lastUndo = null; save(true); render(); toast(T('tRestored'));
  };
  lastUndo = { label, fn: run };
  save(true); render();
  toast(label, { action: { label: T('undo'), fn: run } });
}
/* 全局撤销入口（快捷键 / 命令面板） */
function runUndo() {
  if (!lastUndo) { toast(T('undoNone'), true); return false; }
  lastUndo.fn();
  return true;
}
function confirmBox(title, body, okText, danger) {
  return new Promise(res => {
    const m = document.createElement('div');
    m.className = 'mask';
    m.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p>${body}</p>
      <div class="ma"><button class="btn" data-r="0">${T('cancel')}</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" data-r="1">${esc(okText||T('confirm'))}</button></div></div>`;
    m.addEventListener('click', e => {
      if (e.target === m) { unmountModal(m); res(false); }
      const b = e.target.closest('[data-r]'); if (!b) return;
      unmountModal(m); res(b.dataset.r === '1');
    });
    mountModal(m);
  });
}
function choiceBox(title, body, opts) {

    const m = document.createElement('div');

    m.addEventListener('click', e => {
      if (e.target === m) { unmountModal(m); res(''); }
      const b = e.target.closest('[data-r]'); if (!b) return;
      unmountModal(m); res(b.dataset.r);
    });
    mountModal(m);

}
/* 把备份文件的内容合并进当前数据（「合并」导入模式）。独立成函数，便于直接验证。
   去重优先级：有 id 按 id（两端各自编辑过的同一记录也能正确合并）；
   老备份/无 id 记录才回退按标题/文本去重。
   已删除的记录（墓碑时间 ≥ 记录最后编辑时间）不复活——否则导一份旧备份合并一下，
   之前删掉的东西就全回来了。 */
function importMerge(d) {
  const skip = (arr, item, key, fb) => {
    if (!item || !item[fb]) return true;
    if (item[key]) {
      const dT = Number(S.tomb[item[key]]) || 0;
      if (dT >= (Number(item.updatedAt) || 0)) return true;        // 墓碑仍然有效 → 不复活
      if (arr.some(x => x && x[key] === item[key])) return true;   // 本地已有 → 不重复添加
      if (dT) delete S.tomb[item[key]];                            // 复活有效 → 撤销墓碑
      return false;
    }
    return arr.some(x => x && String(x[fb]) === String(item[fb]));
  };
  (d.projects || []).forEach(p => { if (!skip(S.projects, p, 'id', 'name')) S.projects.push(p); });
  (d.tasks || []).forEach(k => { if (!skip(S.tasks, k, 'id', 'title')) S.tasks.push(k); });
  (d.notes || []).forEach(n => { if (!skip(S.notes, n, 'id', 'text')) S.notes.push(n); });
  if (d.diary) S.diary = Object.assign({}, S.diary, d.diary);
  if (d.tomb) S.tomb = Object.assign({}, S.tomb, d.tomb);
  if (d.diaryTs) S.diaryTs = Object.assign({}, S.diaryTs, d.diaryTs);
  // 回收站按 id 取并集：两端的删除快照都留着，谁都能恢复自己删掉的东西
  if (Array.isArray(d.bin)) {
    const have = new Set(S.bin.map(x => x && x.id));
    d.bin.forEach(e => { if (e && e.id && !have.has(e.id)) { S.bin.push(e); have.add(e.id); } });
    binTrim();
  }
}

function exportBackup() {
  const payload = { v: 1, app: 'workbench', exportedAt: new Date().toISOString(),
                    tasks: S.tasks, notes: S.notes, projects: S.projects, diary: S.diary,
                    tomb: S.tomb, diaryTs: S.diaryTs, bin: S.bin, meta: S.meta };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = T('exportName') + '-' + TODAY() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  S.meta.itemsAtExport = total();
  S.meta.lastExport = Date.now();
  save(true); render();
  toast(T('tExported', total()));
}
function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onerror = () => toast(T('tReadFail'), true);
    rd.onload = async () => {
      let d = null;
      try { d = JSON.parse(String(rd.result)); } catch (e) { toast(T('tBadFile'), true); return; }
      if (!d || (!Array.isArray(d.tasks) && !Array.isArray(d.notes) && !Array.isArray(d.projects))) { toast(T('tBadFile'), true); return; }
      const cnt = (d.tasks || []).length + (d.notes || []).length + (d.projects || []).length;
      const mode = await choiceBox(T('mImportTitle'), T('mImportBody', cnt, total()),
        [{ n: T('mMerge'), v: 'merge' }, { n: T('mReplace'), v: 'replace' }]);
      if (!mode) return;
      if (mode === 'replace') {
        S.tasks = d.tasks || []; S.notes = d.notes || []; S.projects = d.projects || [];
        S.diary = d.diary || {}; S.tomb = d.tomb || {}; S.diaryTs = d.diaryTs || {};
        S.bin = Array.isArray(d.bin) ? d.bin : [];
        lastUndo = null;   // 数据整体被换掉，之前的撤销快照已失效
      } else importMerge(d);
      S.meta.sample = false;
      S.meta.itemsAtExport = total();
      normalize(); save(true); render();
      toast(T('tImported', total()));
    };
    rd.readAsText(f);
  };
  inp.click();
}

function palData() {

/* ---------- 快速输入解析：标题里直接写日期、优先级、#项目 ----------
   支持：今天/明天/后天/大后天、(下)周X / 星期X、M月D日 / M-D / M/D；
   起止区间「A~B」（如 明天~周五、8月1日~8月5日）→ start=A、due=B；
   优先级 !1~!4（或 p1~p4）；#关键词 自动匹配项目名。解析片段会从标题中剔除。 */
function parseQuick(raw) {
  let s = ' ' + raw.replace(/\s+/g, ' ').trim() + ' ';
  const out = { title: raw, prio: null, start: '', due: '', pid: '', tags: [], est: 0 };
  let m = s.match(/\s[!！]([1-4])(?=\s)/);
  if (m) { out.prio = Number(m[1]); s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\s(?:p|P)([1-4])(?=\s)/))) { out.prio = Number(m[1]); s = s.replace(m[0], ' '); }
  const wd = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '日':0, '天':0 };
  /* 单侧日期词解析（供区间使用）：今天/明天/后天/大后天/周X/M-D，无空格 */
  const pickSingle = str => {
    if (/^(今天|今日)$/.test(str)) return TODAY();
    if (/^(明天|明日)$/.test(str)) return shift(TODAY(), 1);
    if (/^后天$/.test(str)) return shift(TODAY(), 2);
    if (/^大后天$/.test(str)) return shift(TODAY(), 3);
    let mm = str.match(/^(下?)(?:周|星期)([一二三四五六日天])$/);
    if (mm) { let d = (wd[mm[2]] - new Date().getDay() + 7) % 7; if (!d) d = 7; return shift(TODAY(), mm[1] ? d + 7 : d); }
    mm = str.match(/^(\d{1,2})[月\/\-.](\d{1,2})[日号]?$/);
    if (mm) {
      const mo = Number(mm[1]), da = Number(mm[2]), y = Number(TODAY().slice(0, 4));
      if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) {
        const mk = yy => `${yy}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
        return mk(y) >= TODAY() ? mk(y) : mk(y + 1);
      }
    }
    return '';
  };
  /* 起止区间：A~B（中文波形符也行）。两端都解析不出就原样保留给下方单侧解析 */
  const rm = s.match(/\s([^\s~～]+)[~～]([^\s~～]+)(?=\s)/);
  if (rm) {
    const a = pickSingle(rm[1]), b = pickSingle(rm[2]);
    if (a || b) {
      out.start = a;
      out.due = b || a || '';
      s = s.replace(rm[0], ' ');
    }
  }
  const pick = re => { const mm = s.match(re); if (!mm) return null; s = s.replace(mm[0], ' '); return mm; };
  if (!out.due && pick(/\s(?:今天|今日)(?=\s)/)) out.due = TODAY();
  else if (!out.due && pick(/\s(?:明天|明日)(?=\s)/)) out.due = shift(TODAY(), 1);
  else if (!out.due && pick(/\s后天(?=\s)/)) out.due = shift(TODAY(), 2);
  else if (!out.due && pick(/\s大后天(?=\s)/)) out.due = shift(TODAY(), 3);
  else if (!out.due && (m = pick(/\s(下?)(?:周|星期)([一二三四五六日天])(?=\s)/))) {
    let d = (wd[m[2]] - new Date().getDay() + 7) % 7; if (!d) d = 7;
    out.due = shift(TODAY(), m[1] ? d + 7 : d);
  } else if (!out.due && (m = pick(/\s(\d{1,2})[月\/\-.](\d{1,2})[日号]?(?=\s)/))) {
    const mo = Number(m[1]), da = Number(m[2]), y = Number(TODAY().slice(0, 4));
    if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) {
      const mk = yy => `${yy}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
      out.due = mk(y) >= TODAY() ? mk(y) : mk(y + 1);
    }
  }
  /* 预估番茄 ~N。必须放在起止区间之后：A~B 的区间语法优先，
     而 ~N 前面是空格（区间语法要求 ~ 前是非空 token），两者不会互相误吃 */
  const em = s.match(/\s[~～](\d{1,2})(?=\s)/);
  if (em) { out.est = Math.max(0, Math.min(20, Number(em[1]))); s = s.replace(em[0], ' '); }
  /* #词：能对上项目名就关联项目，否则记为标签 */
  while ((m = pick(/\s#([^\s#!！@，,。.]+)(?=\s)/))) {
    const key = m[1].toLowerCase();
    const p = S.projects.find(x => x.name.toLowerCase().includes(key))
           || S.projects.find(x => key.includes(x.name.toLowerCase()));
    if (p && !out.pid) out.pid = p.id;
    else out.tags.push(m[1]);
  }
  out.tags = [...new Set(out.tags)].slice(0, 6);
  out.title = s.trim() || raw.trim();
  return out;
}

async function act(a, el) {
  const id = el && el.dataset.id;
  switch (a) {
    case 'nav': ui.view = el.dataset.nav; window.scrollTo({top:0,behavior:'smooth'}); render(); return;
    case 'go': ui.view = el.dataset.to; window.scrollTo({top:0,behavior:'smooth'}); render(); return;
    case 'go-upcoming': ui.view = 'tasks'; ui.taskFilter = 'upcoming'; ui.projFilter = ''; window.scrollTo({top:0,behavior:'smooth'}); render(); return;
    case 'go-tasks-filter': ui.view = 'tasks'; ui.taskFilter = el.dataset.f || 'today'; ui.projFilter = ''; window.scrollTo({top:0,behavior:'smooth'}); render(); return;
    case 'goproj': {
      ui.view = 'projects'; window.scrollTo({top:0,behavior:'smooth'}); render();
      setTimeout(() => {
        const gb = document.querySelector(`.proj .ico-btn[data-id="${id}"]`);
        const card = gb && gb.closest('.proj');
        if (card) {
          card.scrollIntoView({ block: 'center', behavior: 'smooth' });
          card.style.outline = '2px solid var(--accent)';
          setTimeout(() => { card.style.outline = ''; }, 1600);
        }
      }, 60);
      return;
    }
    case 'tfilter': ui.taskFilter = el.dataset.f; render(); return;
    case 'filter-proj': {
      // 从任务清单点：切换筛选；从项目页点：跳到待办并筛选
      const v = el.dataset.id || '';
      ui.projFilter = (ui.projFilter === v && ui.view === 'tasks') ? '' : v;
      if (ui.view !== 'tasks') { ui.view = 'tasks'; ui.taskFilter = 'all'; window.scrollTo({top:0,behavior:'smooth'}); }
      render();
      return;
    }
    case 'add-task-to': {
      ui.view = 'tasks'; ui.projFilter = id; ui.taskFilter = 'all';
      render();
      setTimeout(() => {
        const s = $('tPid'); if (s) s.value = id;
        const i = $('tTitle');
        if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus(); }
      }, 90);
      toast(T('tAddTaskTo', projName(id)));
      return;
    }
    case 'tag': ui.tagFilter = el.dataset.t; ui.view = 'notes'; render(); return;
    case 'week': ui.weekOff = el.dataset.d === '0' ? 0 : ui.weekOff + Number(el.dataset.d); if (ui.weekOff > 0) ui.weekOff = 0; render(); return;
    case 'rev-range': { ui.revRange = el.dataset.r === 'month' ? 'month' : 'week'; render(); return; }
    case 'rev-nav': {
      ui.revMonthOff = el.dataset.d === '0' ? 0 : (ui.revMonthOff || 0) + Number(el.dataset.d);
      if (ui.revMonthOff > 0) ui.revMonthOff = 0;   // 不允许翻到未来
      render(); return;
    }

    case 'toggle': case 'done': {
      const k = tById(id); if (!k) return;
      k.done = a === 'done' ? true : !k.done;
      k.doneAt = k.done ? Date.now() : null;
      k.updatedAt = Date.now();
      if (k.pid) { const p = projById(k.pid); if (p) p.updatedAt = Date.now(); }
      let nextOn = null;
      if (k.done && k.repeat) nextOn = spawnRepeat(k);   // 循环任务：完成即生成下一次
      justDone = k.done ? k.id : null;
      save(); render();
      setTimeout(() => { justDone = null; }, 420);
      if (k.done) {
        if (nextOn !== null) toast(T('tRepeatNext', human(nextOn)));
        else if (combo.day !== TODAY()) { combo = { n: 1, day: TODAY() }; }
        else combo.n++;
        if (nextOn === null && combo.n >= 2) toast(T('combo3', combo.n));
        // 关联项目的任务全做完时给一句提示
        else if (k.pid) {
          const g = projProgress(k.pid);
          toast(g.total && g.done === g.total ? T('tProjCleared', projName(k.pid)) : T('tProjProgress', projName(k.pid), g.done, g.total));
        } else toast(`${pick(T('praise'))} · ${T('tCompleted', k.title.slice(0, 18))}`);
      }
      return;
    }
    case 'tomorrow': {
      const k = tById(id); if (!k) return;
      k.due = shift(TODAY(), 1); k.rolls = (k.rolls||0) + 1; k.carried = null; k.updatedAt = Date.now();
      save(); render(); toast(T('tPostponed'));
      return;
    }
    /* 负荷条「接受建议」：把挑中的任务统一挪到明天，走与单条顺延相同的字段更新 */
    case 'load-move': {
      const ids = String(el && el.dataset.ids || '').split(',').filter(Boolean);
      const ks = ids.map(tById).filter(Boolean);
      if (!ks.length) return;
      const tm = shift(TODAY(), 1);
      ks.forEach(k => { k.due = tm; k.rolls = (k.rolls || 0) + 1; k.carried = null; k.updatedAt = Date.now(); });
      save(true); render(); toast(T('loadMoved', ks.length));
      return;
    }
    case 'roll-all': {
      const od = overdue(); if (!od.length) return;
      if (!await confirmBox(T('mRollTitle'), T('mRollBody', od.length, shift(TODAY(),1)), T('mRollOk'))) return;
      const tm = shift(TODAY(), 1);
      od.forEach(k => { k.due = tm; k.rolls = (k.rolls||0)+1; k.carried = null; k.updatedAt = Date.now(); });
      save(true); render(); toast(T('tPostponedN', od.length));
      return;
    }
    case 'edit-task': { openTaskEdit(id); return; }
    /* --- 批量选择 --- */
    case 'sel-toggle': { ui.selMode = !ui.selMode; if (!ui.selMode) ui.sel = []; render(); return; }
    case 'sel-exit': { ui.selMode = false; ui.sel = []; render(); return; }
    case 'sel-one': {
      const j = ui.sel.indexOf(id);
      if (j >= 0) ui.sel.splice(j, 1); else ui.sel.push(id);
      render(); return;
    }
    case 'sel-all': { ui.sel = taskListArr().arr.map(k => k.id); render(); return; }
    case 'sel-inv': {
      const allIds = taskListArr().arr.map(k => k.id);
      ui.sel = allIds.filter(x => !ui.sel.includes(x));
      render(); return;
    }
    case 'batch-done': {
      const ks = ui.sel.map(tById).filter(Boolean).filter(k => !k.done);
      if (!ks.length) { toast(T('tSelEmpty'), true); return; }
      const n = ks.length, now = Date.now();
      ui.sel = [];
      undoable(T('tBatchDone', n), () => {
        const snap = ks.map(k => ({ k, done: k.done, doneAt: k.doneAt }));
        const born = [];
        ks.forEach(k => {
          k.done = true; k.doneAt = now; k.updatedAt = now;
          if (k.repeat) { spawnRepeat(k); born.push(S.tasks[0]); }   // 循环任务照常生成下一次
        });
        return () => {
          snap.forEach(x => { x.k.done = x.done; x.k.doneAt = x.doneAt; });
          born.forEach(k => { const j = S.tasks.indexOf(k); if (j >= 0) S.tasks.splice(j, 1); });
        };
      });
      return;
    }
    case 'batch-del': {
      const ks = ui.sel.map(tById).filter(Boolean);
      if (!ks.length) { toast(T('tSelEmpty'), true); return; }
      const n = ks.length;
      ui.sel = [];
      undoable(T('tBatchDel', n), () => {
        // 按原始下标升序记录，整体删除；恢复时再按下标升序插回，保证原位不变
        ks.forEach(x => { S.tomb[x.id] = Date.now(); });   // 删除墓碑：防止旧副本复活
        const at = ks.map(k => ({ k, i: S.tasks.indexOf(k) })).filter(x => x.i >= 0).sort((a,b) => a.i - b.i);
        at.forEach(x => binAdd('task', x.k, { idx: x.i }));   // 逐条入回收站，记原下标
        at.forEach(x => { const j = S.tasks.indexOf(x.k); if (j >= 0) S.tasks.splice(j, 1); });
        return () => at.forEach(x => S.tasks.splice(Math.min(x.i, S.tasks.length), 0, x.k));
      });
      return;
    }
    /* --- 看板卡片内的子任务 --- */
    case 'kbsubs': { const kk = tById(id); if (kk) { toggleSubs(id); render(); } return; }
    case 'kbsub': {
      const kk = tById(id); const i = Number(el.dataset.i);
      if (kk && kk.subs && kk.subs[i]) { kk.subs[i].d = !kk.subs[i].d; kk.updatedAt = Date.now(); save(); render(); }
      return;
    }
    case 'del-task': {
      const k = tById(id); if (!k) return;
      undoable(T('tDeleted'), () => {
        S.tomb[k.id] = Date.now();   // 删除墓碑
        const i = S.tasks.indexOf(k);
        binAdd('task', k, { idx: i });   // 入回收站，记原下标
        S.tasks.splice(i, 1);
        return () => { S.tasks.splice(Math.min(i, S.tasks.length), 0, k); };
      });
      return;
    }
    case 'clear-done': {
      // 已完成页：一键清空全部完成记录（可撤销）。不改筛选与批量勾选状态
      const ks = S.tasks.filter(k => k.done);
      if (!ks.length) { toast(T('tSelEmpty'), true); return; }
      undoable(T('tBatchDel', ks.length), () => {
        ks.forEach(x => { S.tomb[x.id] = Date.now(); });
        const at = ks.map(k => ({ k, i: S.tasks.indexOf(k) })).filter(x => x.i >= 0).sort((a, b) => a.i - b.i);
        at.forEach(x => binAdd('task', x.k, { idx: x.i }));   // 逐条入回收站，记原下标
        at.forEach(x => { const j = S.tasks.indexOf(x.k); if (j >= 0) S.tasks.splice(j, 1); });
        return () => at.forEach(x => S.tasks.splice(Math.min(x.i, S.tasks.length), 0, x.k));
      });
      return;
    }
    case 'del-note': {
      const n = S.notes.find(x => x.id === id); if (!n) return;
      undoable(T('tDeleted'), () => {
        S.tomb[n.id] = Date.now();   // 删除墓碑
        const i = S.notes.indexOf(n);
        binAdd('note', n, { idx: i });
        S.notes.splice(i, 1);
        return () => { S.notes.splice(Math.min(i, S.notes.length), 0, n); };
      });
      return;
    }
    case 'del-proj': {
      const p = projById(id); if (!p) return;
      // 人文交互：不再弹确认框。默认保留关联待办（解绑），整体可撤销
      undoable(T('tDeleted'), () => {
        S.tomb[p.id] = Date.now();   // 删除墓碑
        const i = S.projects.indexOf(p);
        const affected = S.tasks.filter(x => x.pid === id);
        binAdd('proj', p, { idx: i, pids: affected.map(x => x.id) });   // 记下被解绑的待办，恢复时挂回
        S.projects.splice(i, 1);
        affected.forEach(x => { x.pid = ''; x.updatedAt = Date.now(); });
        const oldFilter = ui.projFilter === id ? ui.projFilter : null;
        if (ui.projFilter === id) ui.projFilter = '';
        return () => {
          S.projects.splice(Math.min(i, S.projects.length), 0, p);
          affected.forEach(x => { x.pid = id; x.updatedAt = Date.now(); });
          if (oldFilter) ui.projFilter = oldFilter;
        };
      });
      return;
    }
    case 'edit-proj': { openProjEdit(id); return; }
    case 'clear-sample': {
      if (!await confirmBox(T('mClearSampleTitle'), T('mClearSampleBody'), T('bkClearSample'), true)) return;
      // 示例数据在启动时已打上 _s 标记，这里精确清除，用户自己添加的不受影响
      S.tasks = S.tasks.filter(x => !x._s); S.notes = S.notes.filter(x => !x._s); S.projects = S.projects.filter(x => !x._s);
      S.meta.sample = false; S.meta.itemsAtExport = Math.min(S.meta.itemsAtExport, total());
      save(true); render(); toast(T('tSampleCleared'));
      return;
    }
    case 'export': { exportBackup(); return; }
    case 'import': { importBackup(); return; }
    case 'store-pick': { FileStore.pick(); return; }
    case 'store-disconnect': { FileStore.disconnect(); return; }
    case 'store-reconnect': { FileStore.reconnect(); return; }
    case 'conflict-merge': {
      // 把冲突副本里的记录逐份合并进来（幂等：已存在且更新的记录不会被覆盖）
      const names = FileStore.conflicts();
      if (!names.length) { ui.conflictDismissed = true; render(); return; }
      let n = 0;
      for (const nm of names) {
        const d = await FileStore.openConflict(nm);
        if (!d) continue;
        const m = mergeData(S, d);
        const md = mergeDiary(S.diary, S.diaryTs, d.diary, d.diaryTs);
        S.tasks = m.tasks; S.notes = m.notes; S.projects = m.projects; S.tomb = m.tomb;
        S.diary = md.diary; S.diaryTs = md.diaryTs;
        S.meta = mergeMeta(S, d);
        n++;
      }
      if (!n) { toast(T('tBadFile'), true); return; }
      ui.conflictDismissed = true;
      FileStore.clearConflicts();
      normalize(); save(true); render();
      toast(T('tImported', total()));
      return;
    }
    case 'conflict-ignore': { ui.conflictDismissed = true; render(); return; }
    case 'bin-restore': {
      // 恢复：撤销墓碑 + 插回原下标；项目还会把当初解绑的待办重新挂上
      if (!binRestore(id)) { toast(T('binExpired'), true); render(); return; }
      save(true); render(); toast(T('binRestored'));
      return;
    }
    case 'bin-purge': {
      if (!Array.isArray(S.bin) || !S.bin.length) return;
      if (!await confirmBox(T('binPurge'), T('binCount', S.bin.length), T('binPurge'), true)) return;
      S.bin = []; lastUndo = null; save(true); render(); toast(T('binPurged'));
      return;
    }
    case 'palette': { openPalette(); return; }
    case 'theme': { toggleTheme(); return; }
    case 'edit-note': { openNoteEdit(id); return; }
    case 'note-to-task': {
      // 灵感转任务：首行当标题，其余非空行拆成子任务，标签带入；原灵感保留
      const n = S.notes.find(x => x.id === id); if (!n) return;
      const lines = String(n.text || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
      if (!lines.length) { toast(T('tNeedContent'), true); return; }
      S.tasks.unshift({ id: uid(), title: lines[0].slice(0, 140), prio: 2, due: '', start: '',
        done: false, pid: '', createdAt: Date.now(), updatedAt: Date.now(), doneAt: null, rolls: 0,
        repeat: '', pomo: 0, subs: lines.slice(1).slice(0, 9).map(t => ({ t: t.slice(0, 80), d: false })),
        tags: (n.tags || []).slice(0, 6), link: '' });
      save(true); render(); toast(T('tToTask'));
      return;
    }
    case 'scope-clear': {
      ui.projFilter = ''; ui.taskTag = ''; ui.taskQ = ''; render(); return;
    }
    case 'tview': {
      ui.taskView = ['list','board','matrix','timeline','month'].includes(el.dataset.v) ? el.dataset.v : 'list';
      if (ui.taskView === 'month') { ui.selMode = false; ui.sel = []; }   // 月历不做批量；其余视图（列表/看板/四象限/时间轴）均可批量
      savePref(); render(); return;
    }
    case 'pomo': { pomoStart(id); return; }
    case 'togglesubs': { const k = tById(id); if (k) { toggleSubs(id); render(); } return; }
    case 'togglesub': {
      const k = tById(id); const i = Number(el.dataset.i);
      if (k && k.subs && k.subs[i]) { k.subs[i].d = !k.subs[i].d; k.updatedAt = Date.now(); save(); render(); }
      return;
    }
    case 'ttag': { ui.taskTag = ui.taskTag === el.dataset.t ? '' : el.dataset.t; render(); return; }
    case 'cal-nav': {
      ui.monthOff = el.dataset.d === '0' ? 0 : (ui.monthOff || 0) + Number(el.dataset.d);
      render(); return;
    }
    case 'export-week': {
      // 文件名必须跟随当前复盘周期：此前按月导出时内容算月报、文件名却按周计算
      const md = buildWeekMd();
      const P = revPeriod();
      if (el.dataset.mode === 'dl') {
        downloadText(T('reportFile', ui.revRange === 'month' ? T('mdM') : T('mdW'), P.s, P.e), md);
        toast(T('dlReport'));
      } else copyText(md).then(ok => toast(ok ? T('tCopied') : T('tCopyFail'), !ok));
      return;
    }
    case 'export-md': { downloadText(`${T('appName')}-${TODAY()}.md`, buildAllMd()); toast(T('mdExport')); return; }
    case 'nav-toggle': {
      ui.navCollapsed = !document.body.classList.contains('nav-min');
      document.body.classList.toggle('nav-min', ui.navCollapsed);
      savePref();
      return;
    }
    case 'nudge-later': { ui.nudgeHidden = true; savePref(); render(); return; }
    case 'health-fix': {
      // 一键修复：悬空引用/非法日期交给 normalize，空日记直接清；重复 id 仅提示不自动合并
      let cleaned = 0;
      Object.keys(S.diary).forEach(dk => { if (!String(S.diary[dk]).trim()) { delete S.diary[dk]; delete S.diaryTs[dk]; cleaned++; } });
      normalize(); save(true); render();
      toast(T('healthFixed') + (cleaned ? ' · ' + T('healthEmptyDiary', cleaned) : ''));
      return;
    }
    case 'wipe': {
      if (!await confirmBox(T('mWipeTitle'), T('mWipeBody'), T('mWipeOk'), true)) return;
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = blank(); S.meta.sample = false; lastUndo = null; save(true); ui.view = 'tasks'; render(); toast(T('tWiped'));
      return;
    }
  }
}

/* --- 表单与事件绑定 --- */
function bind() {
  const tf = $('taskForm');
  if (tf) tf.onsubmit = e => {
    e.preventDefault();
    const v = $('tTitle').value.trim();
    if (!v) { toast(T('tNeedContent'), true); return; }
    const q = parseQuick(v);   // 标题里可写 明天/周五/M-D、!1~!4、#项目/#标签，解析结果优先于表单控件
    // 「；」分节：第一节是标题，其余生成子任务
    let subs = [];
    const segs = q.title.split(/[；;]/).map(x => x.trim()).filter(Boolean);
    if (segs.length > 1) { q.title = segs[0]; subs = segs.slice(1).slice(0, 9).map(t => ({ t, d: false })); }
    const pid = q.pid || ($('tPid') ? $('tPid').value : '');
    S.tasks.unshift({ id: uid(), title: q.title, prio: q.prio !== null ? q.prio : Number($('tPrio') ? $('tPrio').value : 2),
      due: q.due || ($('tDue') ? $('tDue').value : '') || '',
      start: q.start || ($('tStart') ? $('tStart').value : '') || '',
      done: false, pid: pid, createdAt: Date.now(), updatedAt: Date.now(), doneAt: null, rolls: 0,
      repeat: $('tRepeat') ? $('tRepeat').value : '', pomo: 0, subs, tags: q.tags || [], link: '',
      note: '', status: 'todo', est: Number(q.est) || 0 });
    if (pid) { const p = projById(pid); if (p) p.updatedAt = Date.now(); }
    // 加到未来的任务，自动跳到「即将到来」，否则留在今天
    const due = q.due || ($('tDue') ? $('tDue').value : '') || '';
    ui.taskFilter = (due && due > TODAY()) ? 'upcoming' : 'today';
    ui.pendingDue = '';   // 月历双击预填的一次性日期，用后即清
    save(true); render();
    toast(pid ? T('tAddedTo', projName(pid)) : T('tAdded'));
    setTimeout(() => { const i = $('tTitle'); if (i) i.focus(); }, 40);
  };
  const nf = $('noteForm');
  if (nf) nf.onsubmit = e => {
    e.preventDefault();
    const v = $('nText').value.trim();
    if (!v) { toast(T('tNeedContent'), true); return; }
    const tags = ($('nTags').value || '').split(/[,，;；\s]+/).map(x => x.replace(/^#/, '').trim()).filter(Boolean).slice(0, 6);
    S.notes.unshift({ id: uid(), text: v, tags: [...new Set(tags)], createdAt: Date.now(), updatedAt: Date.now() });
    save(true); render(); toast(T('tNoted'));
    setTimeout(() => { const i = $('nText'); if (i) i.focus(); }, 40);
  };
  const pf = $('projForm');
  if (pf) pf.onsubmit = e => {
    e.preventDefault();
    const v = $('pName').value.trim();
    if (!v) { toast(T('tNeedProjName'), true); return; }
    const nid = uid();
    S.projects.unshift({ id: nid, name: v, stage: $('pStage').value.trim(), next: $('pNext').value.trim(),
      blocker: $('pBlock').value.trim(), status: $('pStat').value, updatedAt: Date.now() });
    save(true); render(); toast(T('tProjAdded'));
  };
  const q = $('nQ');
  if (q) {
    q.oninput = () => {
      ui.noteQ = q.value;
      clearTimeout(q._t);
      q._t = setTimeout(() => { render(); const n = $('nQ'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 260);
    };
  }
  const tq = $('tQ');
  if (tq) {
    tq.oninput = () => {
      ui.taskQ = tq.value;
      clearTimeout(tq._t);
      tq._t = setTimeout(() => {
        render();
        const n = $('tQ');
        if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      }, 260);
    };
  }
  const ts = document.querySelector('[data-sort]');
  if (ts) ts.onchange = () => { ui.taskSort = SORTS[ts.value] ? ts.value : 'def'; savePref(); render(); };
  const bg = document.querySelector('[data-bgroup]');
  if (bg) bg.onchange = () => { ui.boardGroup = ['prio', 'proj', 'tag'].includes(bg.value) ? bg.value : 'prio'; savePref(); render(); };
  const pmin = document.querySelector('[data-pomo="min"]');
  if (pmin) pmin.onchange = () => { ui.pomoMin = Math.min(180, Math.max(1, Number(pmin.value) || 25)); savePref(); toast(T('tPomoSet', ui.pomoMin, ui.pomoBreak)); };
  const pbrk = document.querySelector('[data-pomo="break"]');
  if (pbrk) pbrk.onchange = () => { ui.pomoBreak = Math.min(60, Math.max(1, Number(pbrk.value) || 5)); savePref(); toast(T('tPomoSet', ui.pomoMin, ui.pomoBreak)); };
  const qa = document.querySelector('[data-qa]');
  if (qa) qa.onclick = () => {
    ui.qaOpen = !ui.qaOpen; savePref();
    const det = document.querySelector('.qa-detail');
    if (det) det.style.display = ui.qaOpen ? '' : 'none';
    qa.innerHTML = T('qaMore') + (ui.qaOpen ? I.up : I.down);
  };
  const di = $('diaryIn');
  if (di) di.oninput = () => {
    const dk = TODAY(), dv = di.value.trim();
    if (dv) { S.diary[dk] = dv; S.diaryTs[dk] = Date.now(); }
    else { delete S.diary[dk]; delete S.diaryTs[dk]; }   // 清空即删除条目，不留空记录
    clearTimeout(di._t);
    di._t = setTimeout(() => {
      save(true);
      const f = $('diaryFlag');
      if (f) { f.textContent = '✓ ' + T('diarySaved'); f.style.opacity = .9; setTimeout(() => { if (f) f.style.opacity = 0; }, 1300); }
    }, 600);
  };
  bindDnD();
}

/* 拖拽绑定：卡片 dragstart / 落点 dragover+drop。
   落点：看板列 / 四象限 / 时间轴泳道 / 月历日期格（data-drop），统一走 applyDrop */
function bindDnD() {
  const hold = { id: null };   // 当前拖拽中的任务 id（dragend 后清空，供 drop 兜底）
  document.querySelectorAll('.kb-card, .cal-task').forEach(el => attachCardDrag(el, hold));
  document.querySelectorAll('[data-drop]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('dragover'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('dragover');
      let id = '';
      try { id = e.dataTransfer.getData('text/plain'); } catch (err) {}
      applyDrop(col.dataset.drop, id || hold.id);
    });
  });
}
/* 单卡拖拽：鼠标走 HTML5 DnD，触屏走 pointer 事件（按下后移动超 12px 视为拖拽，
   elementFromPoint 找落点；浏览器抢走手势滚动 → pointercancel 干净放弃，不影响点按）。
   看板卡片与月历任务按钮共用这一套 */
function attachCardDrag(el, hold) {
  el.addEventListener('dragstart', e => {
    hold.id = el.dataset.id;
    el.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', hold.id); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
  });
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); setTimeout(() => { hold.id = null; }, 80); });
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || (e.button !== undefined && e.button !== 0)) return;
    const sx = e.clientX, sy = e.clientY, id0 = el.dataset.id;
    let moved = false, over = null, ta = '';
    try { ta = el.style.touchAction; } catch (err) {}
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    try { el.style.touchAction = 'none'; } catch (err) {}
    const mv = ev => {
      if (moved) {
        let col = null;
        try { col = document.elementFromPoint(ev.clientX, ev.clientY); } catch (err) {}
        const drop = col && col.closest('[data-drop]');
        if (drop !== over) {
          if (over) over.classList.remove('dragover');
          over = drop;
          if (over) over.classList.add('dragover');
        }
        return;
      }
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 12) {
        moved = true; el.classList.add('dragging');
      }
    };
    const up = ev => {
      el.removeEventListener('pointermove', mv);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', cn);
      try { el.style.touchAction = ta; } catch (err) {}
      if (moved) {
        el.classList.remove('dragging');
        if (over) over.classList.remove('dragover');
        let col = null;
        try { col = document.elementFromPoint(ev.clientX, ev.clientY); } catch (err) {}
        const drop = col && col.closest('[data-drop]');
        el.__td = true; setTimeout(() => { el.__td = false; }, 150);   // 吞掉拖拽后的 click
        if (drop) applyDrop(drop.dataset.drop, id0);
      }
    };
    const cn = () => {
      el.removeEventListener('pointermove', mv);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', cn);
      try { el.style.touchAction = ta; } catch (err) {}
      el.classList.remove('dragging');
      if (over) over.classList.remove('dragover');
    };
    el.addEventListener('pointermove', mv);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', cn);
  });
  if (!el.classList.contains('kb-card')) return;   // 月历按钮自带 data-act，交给全局处理
  /* 卡片内的行内操作（子任务、快速完成等）交给全局 act 处理，不再冒泡成「打开编辑弹层」；
     链接是 <a>，点击本来就是跳转，不能同时又开编辑弹层；
     批量模式下，点卡片空白处 = 勾选/取消勾选 */
  el.addEventListener('click', e => {
    if (hold.id || el.__td) return;
    if (e.target.closest('[data-act]')) return;
    if (e.target.closest('a[href]')) return;   // 此前点链接会既跳转又开编辑弹层
    if (ui.selMode) {
      const j2 = ui.sel.indexOf(el.dataset.id);
      if (j2 >= 0) ui.sel.splice(j2, 1); else ui.sel.push(el.dataset.id);
      render();
      return;
    }
    openTaskEdit(el.dataset.id);
  });
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { act('nav', nav); return; }
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b);
});
/* 双击任务标题 → 行内编辑（Enter 存，Esc 退；完整编辑仍走「编辑」按钮） */
document.addEventListener('dblclick', e => {
  /* 月历：双击空白日期格 → 跳到任务页并在那天加任务 */
  const cell = e.target.closest('.cal-cell[data-cell]');
  if (cell && !e.target.closest('button')) {
    ui.view = 'tasks'; ui.taskFilter = 'today'; ui.projFilter = ''; ui.taskView = 'list';
    ui.pendingDue = cell.dataset.cell;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
    setTimeout(() => { const i = $('tTitle'); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus(); } }, 60);
    return;
  }
  const it = e.target.closest('.item[data-id]');
  if (!it || !e.target.closest('.it-title')) return;
  const titleEl = e.target.closest('.it-title');
  if (it.querySelector('.inline-edit')) return;
  const k = tById(it.dataset.id); if (!k) return;
  const inp = document.createElement('input');
  inp.className = 'inline-edit'; inp.value = k.title; inp.maxLength = 140;
  titleEl.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const commit = ok => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (ok && v && v !== k.title) { k.title = v; k.updatedAt = Date.now(); save(true); }
    render();
  };
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') commit(true);
    else if (ev.key === 'Escape') commit(false);
  });
  inp.addEventListener('blur', () => commit(true));
});
$('langBtn').addEventListener('click', switchLang);
$('themeBtn').addEventListener('click', () => toggleTheme());
window.addEventListener('beforeunload', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });

/* 全局键盘快捷键：Ctrl/Cmd+K 搜索、Alt+1~6 切页、N 新任务、Esc 关弹层 */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    if (palState) closePalette(); else openPalette();
    return;
  }
  /* Ctrl/⌘+Z：撤销上一步可撤销操作（删除 / 批量删除 / 清空已完成）。
     toast 消失后仍有效，比只给 4 秒的撤销窗口更可靠 */
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
    const ae0 = document.activeElement;
    if (!palState && !document.querySelector('.mask') && !(ae0 && /^(INPUT|TEXTAREA|SELECT)$/.test(ae0.tagName))) {
      if (runUndo()) e.preventDefault();
      return;
    }
  }
  if (e.key === 'Escape') {
    if (palState) { closePalette(); return; }
    const m = document.querySelector('.mask');
    if (m) unmountModal(m);   // 统一走焦点还原，键盘关闭不丢失上下文
    return;
  }
  if (palState || document.querySelector('.mask')) return;
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (e.altKey && e.key >= '1' && e.key <= '6') {
    e.preventDefault();
    const v = NAV[Number(e.key) - 1];
    if (v) { ui.view = v.k; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
    return;
  }
  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
  if (e.key === 'n' || e.key === 'N') {
    e.preventDefault();
    ui.view = 'tasks';
    if (ui.taskFilter === 'done') ui.taskFilter = 'today';
    render();
    setTimeout(() => { const i = $('tTitle'); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus(); } }, 60);
  }
});

/* --- 启动 --- */
load();
// 给示例数据打标记，便于「清空示例」精确清除
if (S.meta.sample) {
  let need = false;
  ['tasks','notes','projects'].forEach(k => S[k].forEach(x => { if (x._s === undefined) { x._s = true; need = true; } }));
  if (need) save(true);
}
const rolled = rollover();
render();
if (rolled) setTimeout(() => toast(T('tRolledOver', rolled)), 500);
/* 本地文件夹存储：恢复上次选择的文件夹并从 workbench-data.json 读回数据 */
FileStore.init().then(st => {
  if (st === 'ok') render();          // 文件里的数据比 localStorage 更可靠，读回后刷新界面
  renderNav();                        // 刷新侧边栏底部的存储状态文字
  if (st === 'need-perm') { renderConn(); toast(T('tConnLost'), true); }
});
</script>
