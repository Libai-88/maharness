<title data-page-node-id="Zq23PuOZ6lR6dXkZKSOJ8w" data-pnid-children="DBz3G6ilIdxw04kRCwvQJW">个人办公工作台 · Personal Office Workbench</title>
<style data-page-node-id="XtkV839SbjGnUcEEKaOwBO" data-pnid-children="CFVbYqZxbZKEMVfT87f3zr">
:root{  --nav-w:252px;
  --serif:ui-serif,"Songti SC","SimSun","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}

/* 全局 SVG 兜底尺寸 —— 防止任何未显式约束的图标撑满容器 */
svg{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:middle}

body{ color:var(--text);  background-attachment:fixed; background-repeat:no-repeat;  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{border-radius:10px;}


:focus-visible{border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ================= Layout ================= */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:3px;}
.nav::before{
  content:"";position:absolute;top:-70px;left:-70px;width:270px;height:270px;
  background:radial-gradient(circle,rgba(45,212,191,.17),transparent 68%);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 20px;margin-bottom:2px;position:relative}
.brand-mark{  display:flex;align-items:center;justify-content:center;color:#04201e;}
.brand-mark svg{width:19px;height:19px}
.brand-t{font-size:14px;line-height:1.25;white-space:nowrap;}
.brand-s{font-size:11.5px;margin-top:1px;letter-spacing:.2px}
.nav-label{font-size:10.5px;font-weight:700;text-transform:uppercase}

/* 语言切换 */
.lang-btn{
  margin-left:auto;flex:0 0 auto;align-self:flex-start;
  padding:3.5px 8px;border-radius:20px;border:1px solid rgba(255,255,255,.15);  font-size:11px;font-weight:700;letter-spacing:.3px;transition:.15s;box-shadow:none;
}

.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;position:relative;
  padding:10px 11px;text-align:left;font-size:13.5px;
  transition:background .18s ease,color .18s ease;
}


.nav-item.on::before{
  content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);border-radius:0 3px 3px 0;}

.nav-item svg{width:17px;height:17px;transition:color .18s}

.nav-count{
  margin-left:auto;font-size:11px;font-weight:700;min-width:21px;text-align:center;
  padding:1.5px 7px;letter-spacing:.2px
}


.nav-count.zero{display:none}
.nav-foot{margin-top:auto;padding:14px 11px 0;font-size:11px;line-height:1.75}
.nav-foot b{display:block;font-weight:600}

.main{flex:1;min-width:0;}

/* ================= Hero ================= */
.hero{
  position:relative;overflow:hidden;display:flex;align-items:center;
}
.hero-c{position:relative;max-width:660px;min-width:0;z-index:2}
.hero-eyebrow{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;text-transform:uppercase;margin-bottom:10px;flex-wrap:wrap}
.hero-eyebrow svg{width:14px;height:14px}
.hero h1{margin:0;line-height:1.28;word-break:break-word}
.hero p{margin:8px 0 0;font-size:13.5px;line-height:1.7;max-width:520px;word-break:break-word}



/* ================= Topbar ================= */
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.topbar h1{margin:0;line-height:1.3}
.topbar .sub{font-size:12.5px;color:var(--text-3);margin-top:4px;line-height:1.6}
.topbar-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ================= Buttons ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;  transition:border-color .16s,background .16s,color .16s,box-shadow .18s,transform .12s;
  white-space:nowrap;letter-spacing:.1px;
}


.btn svg{width:15px;height:15px}




.btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--radius-xs)}
.btn-sm svg{width:13.5px;height:13.5px}

/* ================= Card ================= */
.card{
  background:var(--surface);overflow:hidden;
  transition:box-shadow .3s cubic-bezier(.2,.8,.3,1),transform .3s cubic-bezier(.2,.8,.3,1);
}

.card-h{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card-h > svg{width:17px;height:17px;flex:0 0 17px}
.card-h h2{margin:0;font-size:14.5px;}
.card-h .hint{font-size:11.5px;font-weight:500}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}



/* ================= Focus banner ================= */
.focus{margin-bottom:18px;overflow:hidden;}
.focus.clear{  box-shadow:0 1px 2px rgba(10,90,82,.05),0 10px 26px rgba(10,90,82,.08);
}
.focus-h{
  display:flex;align-items:center;gap:10px;}

.focus-h h2{margin:0;font-size:15px;font-weight:700;color:var(--danger);letter-spacing:-.1px}
.focus.clear .focus-h h2{color:var(--accent-deep)}
.focus-h > svg{width:18px;height:18px;color:var(--danger);flex:0 0 18px}
.focus.clear .focus-h > svg{color:var(--accent)}
.focus-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.frow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.frow:last-child{border-bottom:none}
.frow .ft{flex:1;min-width:0}
.frow .ft b{font-weight:600;display:block;word-break:break-word;font-size:13.8px;letter-spacing:-.05px}
.frow .ft span{font-size:12px;color:var(--text-2);display:block;margin-top:3px;word-break:break-word;line-height:1.6}
.frow .ft span b,.frow .ft span strong{display:inline}
.frow .fa{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;margin-top:8px;flex:0 0 6px;}
.allclear{display:flex;align-items:center;gap:9px;padding:11px 0;color:var(--text-2);font-size:13px}
.allclear svg{width:17px;height:17px;}

/* 非焦点页的紧凑提醒条 */
.mini-alert{
  display:flex;align-items:center;gap:10px;padding:11px 16px;margin-bottom:18px;}
.mini-alert > svg{width:16px;height:16px;color:var(--danger);flex:0 0 16px}
.mini-alert .mt{flex:1;min-width:0;font-size:13px;}
.mini-alert .mt b{color:var(--danger);font-weight:700}

/* ================= Pills ================= */
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;  padding:2.5px 9px;  white-space:nowrap;letter-spacing:.1px;line-height:1.6;
}










/* ================= Forms ================= */
.form{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.grow{flex:1 1 220px}
.f label{font-size:11px;font-weight:700;text-transform:uppercase}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:9.5px 12px;border:1px solid var(--line);outline:none;transition:border-color .16s,box-shadow .16s,background .16s;
}

textarea{resize:vertical;min-height:78px;line-height:1.68}

input::placeholder,textarea::placeholder{color:var(--text-4)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238aa3a1' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}

/* ================= Task list ================= */
.seg{display:inline-flex;}
.seg button{padding:5.5px 13px;font-size:12.5px;font-weight:600;transition:.16s}
.seg button:hover{color:var(--text)}

.list{display:flex;flex-direction:column}
.item{
  display:flex;gap:12px;border-bottom:1px solid var(--line-soft);
  align-items:flex-start;position:relative;transition:background .15s;
}
.item:last-child{border-bottom:none}
.item::before{content:"";position:absolute;top:11px;bottom:11px;width:2.5px;border-radius:0 3px 3px 0;background:transparent;transition:background .15s}






.item.od::before{left:0}

.item.done .it-title{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-3)}
.chk{
  width:20px;height:20px;flex:0 0 20px;border:1.8px solid #bdd3d1;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.16s;
}
.chk:hover{transform:scale(1.08);}

.chk svg{width:12.5px;height:12.5px;color:#fff;opacity:0;stroke-width:3.6}
.chk.on svg{opacity:1}
.it-main{flex:1;min-width:0}
.it-title{word-break:break-word;font-size:13.9px;letter-spacing:-.05px;line-height:1.55}
.it-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.it-act{display:flex;gap:3px;flex-shrink:0;align-items:center}
.ico-btn{width:31px;height:31px;display:flex;align-items:center;justify-content:center;transition:.15s}


.ico-btn svg{width:15px;height:15px}

/* ================= 日期分组（即将到来） ================= */
.dgroup{margin-bottom:6px}
.dgroup:last-child{margin-bottom:0}
.dgroup-h{
  display:flex;align-items:center;gap:9px;padding:12px 0 7px;
  position:sticky;top:0;z-index:2;
}
.dg-d{font-size:12.5px;font-weight:700;color:var(--accent-deep);letter-spacing:.1px}
.dg-x{font-size:11.5px;color:var(--text-4)}
.dg-n{margin-left:auto;font-size:11px;font-weight:650;color:var(--text-3);background:var(--bg-2);padding:1.5px 8px;border-radius:20px}
.dgroup .list{border-left:2px solid var(--line-soft);padding-left:13px;margin-left:2px}
.dgroup .item::before{display:none}

/* ================= 子筛选栏（按项目） ================= */
.subbar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);}
.sb-l{font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:.5px;text-transform:uppercase;margin-right:2px}
.subbar select{width:auto;min-width:112px;padding:6.5px 30px 6.5px 11px;font-size:12.5px}

/* 任务上的项目标签 */
.pill.proj-link{
  background:var(--accent-soft);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(13,148,136,.16);transition:.15s;border:none;font-family:inherit;
}

.pill.proj-link svg{width:11px;height:11px}

/* ================= 项目卡内的关联待办 ================= */
.ptasks{margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
.pt-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.pt-t{font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:.5px;text-transform:uppercase}
.pt-c{font-size:11.5px;font-weight:650;color:var(--text-2)}
.pt-c .rd{color:var(--danger)}
.pt-h .btn{margin-left:auto}
.pt-bar{height:6px;border-radius:20px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 1px 2px rgba(10,50,46,.05)}
.pt-fill{display:block;height:100%;border-radius:20px;transition:width .55s cubic-bezier(.4,0,.2,1)}

.pt-list{display:flex;flex-direction:column;gap:1px}
.pt-i{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px}
.pt-chk{
  width:16px;height:16px;flex:0 0 16px;border:1.6px solid #c8dad9;border-radius:5px;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s;
}
.pt-chk:hover{border-color:var(--accent);background:var(--accent-soft)}
.pt-chk svg{width:10px;height:10px;color:var(--accent);opacity:0;stroke-width:3.6}
.pt-chk:hover svg{opacity:.75}
.pt-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#20403e}
.pt-d{font-size:11px;color:var(--text-4);flex-shrink:0;font-weight:550}
.pt-d.od{color:var(--danger);font-weight:700}
.pt-more{
  margin-top:5px;font-size:11.5px;font-weight:650;color:var(--accent-dark);
  text-align:left;padding:3px 0;transition:.15s;
}
.pt-more:hover{color:var(--accent-deep);text-decoration:underline}
.pt-none{font-size:12px;color:var(--text-4);line-height:1.6}
.pt-done{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--accent-dark);font-weight:550}
.pt-done svg{width:14px;height:14px;}

/* ================= Notes ================= */
.tagbar{display:flex;gap:7px;flex-wrap:wrap}
.tag-chip{
  padding:4.5px 12px;font-size:12px;
  font-weight:600;transition:.15s;}


.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));}
.note{
  border:1px solid var(--line);padding:15px 16px;position:relative;transition:box-shadow .26s,border-color .26s,transform .26s;}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--radius-sm) 0 0 var(--radius-sm);background:linear-gradient(180deg,#14b8a6,var(--cyan));opacity:.85}
.note:hover{box-shadow:0 2px 6px rgba(12,52,48,.07),0 14px 32px rgba(12,52,48,.1);}
.note:hover::before{opacity:1}
.note p{margin:0 0 11px;white-space:pre-wrap;word-break:break-word;font-size:13.4px;line-height:1.68;padding-right:26px;}
.note .nf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note .nf time{font-size:11px;color:var(--text-4);margin-left:auto;font-weight:500}
.note .del{position:absolute;top:8px;right:8px;opacity:0;transition:.15s}
.note:hover .del{opacity:1}

/* ================= Projects ================= */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));}
.proj{
  border:1px solid var(--line);padding:16px;background:var(--surface);transition:box-shadow .2s,transform .2s,border-color .2s;position:relative;overflow:hidden;
}
.proj::after{content:"";position:absolute;left:0;right:0;top:0;height:2.5px;}





.proj-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid var(--line-soft)}
.proj-h b{font-size:14.5px;font-weight:660;word-break:break-word;letter-spacing:-.15px}
.proj-h .sp{margin-left:auto;display:flex;gap:2px;align-items:center;flex-shrink:0}
.kv{display:flex;gap:10px;padding:5.5px 0;font-size:13px;align-items:flex-start}
.kv .k{flex:0 0 50px;color:var(--text-4);font-size:11px;font-weight:700;padding-top:2.5px;letter-spacing:.4px;text-transform:uppercase}
.kv .v{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap;line-height:1.62;color:#1c3b39}
.kv .v.em{color:var(--danger);font-weight:560}
.kv .v.na{color:var(--text-4)}

/* ================= Review ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:13px}
.stat{
  border:1px solid var(--line);padding:15px 16px;  transition:box-shadow .26s,transform .26s;
}
.stat:hover{border-color:#cbe1df}   /* 悬停只加深边框，不做位移（去 AI 化约定） */
.stat .n{letter-spacing:-1px;line-height:1.08;}
.stat .l{font-size:11.5px;color:var(--text-3);margin-top:5px;font-weight:600;letter-spacing:.3px}


.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .bl{flex:0 0 108px;font-size:12.5px;color:var(--text-2);font-weight:570}
.bar-track{flex:1;display:block;height:9px;background:var(--bg-2);border-radius:20px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(10,50,46,.05)}
.bar-fill{display:block;height:100%;min-width:3px;border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.bar-fill.z{min-width:0}
.bar-row .bv{flex:0 0 48px;text-align:right;font-size:12.5px;font-weight:700;color:var(--text-2)}
.blk{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px;line-height:1.65}
.blk:last-child{border-bottom:none}
.blk b{font-weight:650}
.blk span{color:var(--danger)}

/* ================= Empty ================= */
.empty{text-align:center;padding:34px 16px;color:var(--text-4);font-size:13px}
.empty svg{width:28px;height:28px;margin-bottom:10px;stroke-width:1.6}

/* ================= Backup ================= */
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:13px}
.bk{border:1px solid var(--line);padding:17px;box-shadow:var(--sh-1)}
.bk h3{margin:0 0 6px;font-size:13.5px;font-weight:660;display:flex;align-items:center;gap:8px}
.bk h3 svg{width:16px;height:16px;}
.bk p{margin:0 0 14px;font-size:12.5px;color:var(--text-2);line-height:1.68}

/* 范围筛选摘要条（非列表视图）：让仍在生效的筛选可见、可一键清除 */
.scopebar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px;padding:8px 13px;border:1px dashed var(--line);border-radius:9px;background:var(--bg-2)}

/* 回收站：删除记录的快照列表 */
.bin-list{display:flex;flex-direction:column}.bin-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.bin-row:last-child{border-bottom:none}
.bin-row .bin-k{flex:0 0 auto;min-width:34px;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--text-4)}
.bin-row .bin-n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.bin-row .bin-t{flex:0 0 auto;font-size:11.5px;color:var(--text-4)}

/* ================= Nudge ================= */
.nudge{
  display:flex;gap:12px;align-items:flex-start;padding:14px 18px;margin-bottom:18px;}
.nudge svg.i{width:18px;height:18px;color:var(--warn);flex:0 0 18px;margin-top:2px}
.nudge .nt{flex:1;min-width:0;font-size:13px;line-height:1.65}
.nudge .nt b{display:block;font-weight:700;color:var(--warn);margin-bottom:2px;font-size:13.5px}
.nudge .na{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;align-items:center}

/* ================= Toast / Modal ================= */
.toasts{position:fixed;display:flex;flex-direction:column;gap:10px;z-index:90;align-items:flex-end}
.toast{padding:12px 17px;  font-size:13px;  display:flex;align-items:center;gap:9px;animation:tin .28s cubic-bezier(.2,.9,.3,1);max-width:min(90vw,370px);
}
.toast svg{width:15px;height:15px;flex:0 0 15px;}


@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.mask{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fin .18s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{max-width:430px;width:100%;animation:min .24s cubic-bezier(.2,.9,.3,1)}
@keyframes min{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 9px;font-size:16.5px;font-weight:660;letter-spacing:-.2px}
.modal p{margin:0 0 20px;font-size:13.5px;color:var(--text-2);line-height:1.7}
.modal .ma{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ================= 侧栏搜索 / 命令面板（Ctrl K） ================= */
.nav-search{
  display:flex;align-items:center;gap:9px;width:calc(100% - 12px);margin:2px 6px 8px;padding:8.5px 11px;font-size:13px;font-weight:540;text-align:left;transition:.15s;
}

.nav-search svg{width:14.5px;height:14.5px;flex:0 0 auto}
.nav-search #navSearchLabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-search .kbd{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.3px;border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:1px 6px;white-space:nowrap}
#themeBtn{display:inline-flex;align-items:center;gap:4px;padding:3.5px 5px;margin-left:2px}
#themeBtn svg{width:13px;height:13px}
.palette{max-width:540px;padding:0;overflow:hidden}
.palette .pi{width:100%;border:none;border-bottom:1px solid var(--line-soft);border-radius:0;padding:15px 18px;font-size:15px;background:transparent;box-shadow:none}
.palette .pi:focus{box-shadow:none;border-bottom-color:var(--accent);background:transparent}
.pal-list{max-height:328px;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:9.5px 12px;border-radius:9px;font-size:13.2px;color:var(--text-2);text-align:left;transition:background .1s}
.pal-item svg{width:15px;height:15px;color:var(--text-4);flex:0 0 15px}
.pal-item .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .pk{font-size:11px;color:var(--text-4);flex-shrink:0;font-weight:600;letter-spacing:.3px}


.pal-empty{padding:22px;text-align:center;font-size:12.5px;color:var(--text-4)}
.pal-foot{display:flex;gap:14px;padding:9px 15px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--text-4);}

/* 灵感卡：编辑按钮（悬停显示） */
.note .editn{position:absolute;top:8px;right:44px;opacity:0;transition:.15s}
.note:hover .editn{opacity:1}
@media (max-width:860px){ .nav-search .kbd{display:none} .note .editn{opacity:1} }

/* ================= 人味细节 ================= */
/* 侧栏收起拉手：卡在导航右缘，点一下收成图标栏 */
.nav-tab{
  position:absolute;top:60px;right:-13px;width:24px;height:46px;z-index:60;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px 12px 12px 8px;transition:.15s;
}

.nav-tab svg{width:14px;height:14px;transition:transform .25s}
body.nav-min .nav-tab svg{transform:rotate(180deg)}
@media (max-width:860px){ .nav-tab{display:none} }
@media (min-width:861px){
  body.nav-min .nav{width:66px;flex:0 0 66px;padding:20px 9px 14px;align-items:center}
  body.nav-min .brand{flex-direction:column;gap:10px;padding:0 0 12px}
  body.nav-min .brand > div:nth-child(2),
  body.nav-min .lang-btn,
  body.nav-min .nav-label,
  body.nav-min .nav-foot{display:none}
  body.nav-min .nav-search{width:100%;justify-content:center;padding:9px 0;margin-bottom:6px}
  body.nav-min .nav-search #navSearchLabel,
  body.nav-min .nav-search .kbd{display:none}
  body.nav-min .nav-item{justify-content:center;padding:11px 0}
  body.nav-min .nav-item > span{display:none}
  body.nav-min .nav-item .nav-count{display:block;position:absolute;top:3px;right:3px;margin:0;min-width:15px;padding:0 4px;font-size:9.5px}
}
/* 英文品牌名较长：允许换行、缩小字号，避免顶出侧栏 */
html[lang="en"] .brand-t{white-space:normal;font-size:12px;line-height:1.35;letter-spacing:0}
html[lang="en"] .brand-s{font-size:10.5px}
/* 便签微微歪着贴，悬停时「扶正」；便签纸带一点色彩差异，正文用衬线体更像手账 */
.notes .note{transition:box-shadow .26s,border-color .26s,transform .26s cubic-bezier(.2,.8,.3,1)}





.note p{letter-spacing:.1px}
/* 打勾弹一下（只对刚完成的那一项播放，避免每次重渲染都弹） */
@keyframes chkpop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}

/* 拖拽中的卡片微微翘起 */
.kb-card.dragging{transform:rotate(2.2deg) scale(1.02)}
/* hero 的随机小句子 */
.hero-hey{margin:7px 0 0;font-size:12.5px;opacity:.82}




/* ================= 书香气息 ================= */
/* 品牌标改朱砂印章「勤」，微歪如手钤 */
.brand-mark{
  width:32px;height:32px;flex:0 0 32px;}
.brand-mark .seal-char{font-size:17px;font-weight:700;line-height:1}
/* 标题全面衬线化：书卷味 */


/* hero 右侧竖排箴言 */
.hero-motto{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);z-index:2;
  writing-mode:vertical-rl;font-family:var(--serif);font-size:15px;user-select:none;pointer-events:none;line-height:1.9;
}

@media (max-width:860px){ .hero-motto{display:none} }
/* 今日签：左竖签条 + 名句 + 宜忌 */
.sign-card{
  display:flex;align-items:stretch;gap:15px;margin-bottom:16px;padding:14px 18px;}

.sign-tab{
  flex:0 0 auto;writing-mode:vertical-rl;font-family:var(--serif);font-size:13.5px;font-weight:700;padding:8px 5px;user-select:none;
}

.sign-q{flex:1;min-width:0;align-self:center}
.sign-q p{margin:0;font-family:var(--serif);letter-spacing:.6px;line-height:1.7;}
.sign-q span{display:block;margin-top:5px;font-size:12px;font-family:var(--serif)}
.sign-yj{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;justify-content:center;padding-left:15px;}
.sign-yj > div{display:flex;align-items:center;gap:8px;font-size:13px}
.sign-yj b{
  font-family:var(--serif);flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;font-size:12.5px;color:#fff;
}


.sign-yj span{font-family:var(--serif);letter-spacing:1px}
/* 今日一笔：一行日记，就地落笔 */
.diary-card{display:flex;align-items:center;gap:11px;}
.diary-card .dt{font-family:var(--serif);font-weight:700;font-size:13px;flex:0 0 auto;letter-spacing:1px}
.diary-card input{flex:1;min-width:0;border:none;background:transparent;padding:4px 2px;font-family:var(--serif);font-size:13.5px;border-radius:0}
.diary-card input:focus{box-shadow:none;background:transparent}
.diary-card .df{flex:0 0 auto;font-size:11.5px;opacity:0;transition:opacity .3s;font-family:var(--serif)}
/* 信纸便签：淡格线 */
.note::after{
  content:"";position:absolute;inset:36px 14px 34px;pointer-events:none;border-radius:3px;}

/* 完成时的一圈水墨涟漪 */
@keyframes inkrip{0%{box-shadow:0 0 0 0 rgba(14,139,128,.32)}100%{box-shadow:0 0 0 13px rgba(14,139,128,0)}}
.chk.on.just{animation:chkpop .32s ease, inkrip .55s ease-out}

/* ================= 任务多视图：看板 / 四象限 / 时间轴 ================= */
.viewseg-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.viewseg-wrap select{width:auto;min-width:132px;padding:7.5px 30px 7.5px 12px;font-size:12.5px}
.viewhint{font-size:11.5px;margin:-4px 0 10px}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;align-items:start}
.kb-col{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:10px;min-height:110px;transition:border-color .15s,background .15s}

.kb-h{display:flex;align-items:center;gap:8px;padding:2px 4px 9px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.kb-h .dotc{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.kb-h .n{margin-left:auto;font-size:11px;font-weight:650;color:var(--text-3);background:var(--surface);border-radius:20px;padding:1px 8px}
.kb-cards{display:flex;flex-direction:column;gap:7px;min-height:26px}
.kb-card{border:1px solid var(--line);padding:9px 11px;cursor:grab;transition:box-shadow .15s,border-color .15s}

.kb-card:active{cursor:grabbing}
.kb-card.dragging{opacity:.45}
.kb-card .t{font-size:13px;font-weight:560;line-height:1.5;word-break:break-word;color:var(--text)}
.kb-card .m{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}
.kb-empty{font-size:11.5px;color:var(--text-4);padding:6px 4px}
.mtx{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mtx-q{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:10px;min-height:150px;transition:border-color .15s,background .15s}

.mtx-q .qh{display:flex;align-items:baseline;gap:7px;padding:2px 4px 9px;flex-wrap:wrap}
.mtx-q .qh b{font-size:12.5px;font-weight:700;color:var(--text-2)}
.mtx-q .qh span{font-size:11px;color:var(--text-4)}
.tl{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:stretch}
.tl-col{flex:0 0 172px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px;min-height:170px;transition:border-color .15s,background .15s}

.tl-h{padding:1px 3px 8px;font-size:12px;font-weight:700;color:var(--text-2)}
.tl-h .d2{font-size:10.5px;color:var(--text-4);font-weight:600;margin-left:4px}
.tl-col.today .tl-h{color:var(--accent-deep)}
.tl-col.rod{opacity:.82}
/* 番茄钟浮条 */
.pomobar{position:fixed;left:24px;bottom:24px;z-index:85;display:flex;align-items:center;gap:11px;color:#fff;padding:11px 15px;font-size:13px;max-width:min(86vw,440px);animation:tin .28s cubic-bezier(.2,.9,.3,1)}
.pomobar .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}

@media print{
  .nav,.topbar-act,.it-act,.ico-btn,.nudge,.pomobar,.batchbar,.mask,.viewseg-wrap,.nav-tab,.lang-btn,.theme-btn{display:none}
  .card,.focus{box-shadow:none;break-inside:avoid}
  /* 打印一律白底黑字：深色模式下打印会费墨且部分区域对比不足，这里覆盖主题变量 */
  html[data-theme=dark]{
    --bg:#fff; --bg-2:#f5f5f3; --surface:#fff; --line:#ccc; --line-soft:#eee;
    --text:#111; --text-2:#444; --text-3:#777; --text-4:#9a9a94;
    --accent:#111; --accent-dark:#111; --accent-deep:#111; --accent-fg:#fff;
    --cyan:#3f6b60; --danger:#a8453f; --warn:#8a7340;
  }
  html[data-theme=dark] body{background:#fff;color:#111}
  .item,.note,.proj,.frow,.blk,.kb-card,.sign-card{break-inside:avoid}
  .kanban{display:block}

/* =================================================================
   纸墨重构 · 最终视觉基调
   宣纸底 / 墨色字 / 朱砂点睛 / 细线直角 / 无渐变无花哨
   （置于样式表末尾，以同优先级覆盖此前的全部配色）
   ================================================================= */






/* —— 侧栏：墨色条，浮一片纸 —— */











.nav-item.on::before{background:#c96a55;box-shadow:none;width:3px;height:18px}


.nav-count{border-radius:3px}

.nav-count.hot{box-shadow:none}


.nav-search{border:1px solid rgba(255,255,255,.1);border-radius:4px}


.nav-tab{border:1px solid #38332a;border-left:none;}


/* —— 按钮：细边直角，主按钮墨底 —— */
.btn{border:1px solid var(--line);}

.btn:active{transform:none;box-shadow:none}
.btn-primary{box-shadow:none}
.btn-primary:hover{transform:none;}



/* —— 卡片：纸面细框，去浮动 —— */



.card-h .hint{color:var(--text-4)}
.subbar{background:transparent}


/* —— Hero：去照片去光斑，一块素纸 —— */



.hero p b{color:var(--accent-deep)}
.hero p .rd{color:var(--danger)}




/* —— 胶囊：去彩底，细框单色 —— */

.pill svg{width:11px;height:11px}
.pill.red{background:transparent;border-color:var(--danger-line);color:var(--danger);box-shadow:none}
.pill.teal{background:transparent;border-color:#a8b8ab;color:var(--cyan);box-shadow:none}
.pill.cyan{background:transparent;border-color:#a8b8ab;color:var(--cyan);box-shadow:none}
.pill.warn{background:transparent;border-color:#d3c28d;color:var(--warn);box-shadow:none}
.pill.gray{background:transparent;border-color:var(--line);color:var(--text-3)}
.p1{background:transparent;border:1px solid var(--danger);color:var(--danger);box-shadow:none}
.p2{background:transparent;border:1px solid #c2a45c;color:var(--warn);box-shadow:none}
.p3{background:transparent;border:1px solid #7d9a8e;color:var(--cyan);box-shadow:none}
.p4{background:transparent;border:1px solid var(--line);color:var(--text-3);box-shadow:none}

/* —— 表单与勾选 —— */




.chk.on{box-shadow:none}
.seg{gap:1px}
.seg button{color:var(--text-3)}

.tag-chip{background:var(--surface);border:1px solid var(--line);color:var(--text-2);box-shadow:none}
.tag-chip:hover{border-color:#a99e84;color:var(--text)}



/* —— 焦点条 / 提醒：纸面 + 细线 —— */



.focus.clear .focus-h{background:transparent;border-bottom:1px solid var(--line-soft)}
.mini-alert{border-radius:5px;}
.nudge{border-radius:6px;}

/* —— 便签：统一素纸，去彩纸去大歪斜 —— */
.notes .note{background:var(--surface)}





.note::before{display:none}
.note::after{background:repeating-linear-gradient(transparent 0 24px, rgba(90,80,60,.07) 24px 25px)}

html[data-theme=dark] .notes .note:nth-child(4n+1),
html[data-theme=dark] .notes .note:nth-child(4n+2),
html[data-theme=dark] .notes .note:nth-child(4n){background:var(--surface)}
html[data-theme=dark] .note::after{background-image:repeating-linear-gradient(transparent 0 24px, rgba(230,223,208,.05) 24px 25px)}

/* —— 统计 / 项目 —— */


.stat.red{background:var(--surface);border-color:var(--danger-line)}


.proj::after{background:var(--line)}
.proj.blocked{background:var(--surface);}
.proj.blocked::after{background:var(--danger)}
.proj.done{background:var(--surface)}
.proj.done::after{background:var(--line)}


.empty svg{color:#c0b69e}
.dot{background:var(--danger);}


.ico-btn.red:hover{background:var(--danger-soft);color:var(--danger)}
.pill.proj-link:hover{box-shadow:none}

/* —— 浮层 / 提示 —— */

.modal{background:var(--surface);}





.pomobar.break{border-color:#4a5c55}

/* —— 今日签 / 今日一笔 —— */

html[data-theme=dark] .sign-card{border-color:#453d2b}
.sign-tab{border:1px solid rgba(140,58,43,.45);background:transparent;letter-spacing:4px}
html[data-theme=dark] .sign-tab{color:#d9b8a8;border-color:rgba(217,184,168,.4);background:transparent}
.sign-q p{font-size:17px;}
.sign-q span{color:var(--text-4)}
.sign-yj{border-left:1px solid var(--line-soft)}
.sign-yj b.yi{background:transparent;border:1px solid #7d9a8e;border-radius:3px}
.sign-yj b.ji{background:transparent;border:1px solid var(--danger);border-radius:3px}
.sign-yj span{color:var(--text-2)}



/* —— 深色主题：暖墨夜 —— */
html[data-theme=dark]{  --sh-1:0 1px 2px rgba(0,0,0,.25);
  --sh-2:0 1px 3px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
  --sh-3:0 2px 5px rgba(0,0,0,.35), 0 14px 30px rgba(0,0,0,.4);
}


html[data-theme=dark] .hero{border-color:var(--line)}
html[data-theme=dark] .hero h1{color:var(--text)}
html[data-theme=dark] .note{background:var(--surface)}
html[data-theme=dark] .stat,html[data-theme=dark] .bk,html[data-theme=dark] .proj.done{background:var(--surface)}
html[data-theme=dark] .focus,html[data-theme=dark] .focus.clear{background:var(--surface)}
html[data-theme=dark] .modal{background:var(--surface);border-color:var(--line)}
html[data-theme=dark] .kv .v{color:var(--text)}
html[data-theme=dark] .pt-n{color:var(--text)}
html[data-theme=dark] .note p{color:var(--text)}

html[data-theme=dark] .p4,html[data-theme=dark] .pill.gray{background:transparent;border-color:var(--line);color:var(--text-3);box-shadow:none}
html[data-theme=dark] .p1{background:transparent;border-color:var(--danger);color:var(--danger)}
html[data-theme=dark] .p2{background:transparent;border-color:#c2a45c;color:var(--warn)}
html[data-theme=dark] .p3{background:transparent;border-color:#7d9a8e;color:var(--cyan)}
html[data-theme=dark] .diary-card input{background:transparent;border-bottom-color:var(--line)}

/* =================================================================
   交互去 AI 化 · 人文界面层
   ================================================================= */
/* toast：纸面单条，撤销入口。不再深色圆角堆叠 */
.toasts{bottom:20px;right:20px}


.toast.err{border-color:var(--danger-line);}

.toast .undo{
  background:none;border:none;padding:2px 4px;margin-left:6px;cursor:pointer;font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;
  font-family:inherit;
}
.toast .undo:hover{color:var(--accent-dark)}
/* 悬停克制：一切卡片不再位移上浮 */

.note:hover{border-color:#b7ad94}


/* 行内编辑（双击标题） */
.inline-edit{
  font:inherit;color:inherit;width:100%;padding:1px 2px;margin:-1px -2px;
  background:transparent;border:none;outline:none;
  border-bottom:1px solid var(--accent);border-radius:0;box-shadow:none;
}
/* 空状态：去图标，改「」短句 */
.empty svg{display:none}
.empty div::before{content:'「';color:var(--text-4)}
.empty div::after{content:'」';color:var(--text-4)}
/* 页风口：topbar 下双线（左右双边之意的横用） */

/* 版心鱼尾：卡片标题前的折页记号 */
.card-h h2{display:flex;align-items:center}
.card-h h2::before{
  content:'';flex:0 0 auto;  border-left:8px solid var(--text-3);}
/* 签卡引文左侧一线朱丝栏 */
.sign-q{padding-left:15px}
html[data-theme=dark] .sign-q{border-left-color:rgba(217,184,168,.28)}

/* —— 本地文件夹断连警示条 —— */
.conn-warn{
  display:flex;gap:12px;align-items:flex-start;padding:13px 17px;margin-bottom:18px;border-radius:var(--radius);}
.conn-warn svg.i{width:18px;height:18px;color:var(--danger);flex:0 0 18px;margin-top:2px}
.conn-warn .nt{flex:1;min-width:0;font-size:13px;color:var(--text-2);line-height:1.65}
.conn-warn .nt b{display:block;color:var(--danger);font-weight:700;margin-bottom:2px;font-size:13.5px}
.conn-warn .na{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;align-items:center}
@media (max-width:860px){ .conn-warn{flex-wrap:wrap} .conn-warn .na{width:100%} .conn-warn .na .btn{flex:1} }

/* —— 新功能：子任务 / 标签 / 链接 / 月历 / 热力 / 回忆 —— */
.pill.tg{border-style:dashed;color:var(--text-2)}
a.pill{text-decoration:none}
.subs{display:flex;flex-direction:column;gap:4px;margin-top:9px}
.sub-i{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
.sub-chk{width:15px;height:15px;flex:0 0 15px;border:1px solid #c4baa4;border-radius:3px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
.sub-chk svg{width:9px;height:9px}
.sub-chk:hover{border-color:var(--accent);background:var(--accent-soft2)}

.sub-i .d{text-decoration:line-through;color:var(--text-4)}
.kb-card .pill svg{width:10px;height:10px}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-nav b{font-size:14.5px;font-family:var(--serif);letter-spacing:1px;color:var(--text)}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head span{font-size:11px;color:var(--text-4);text-align:center;padding-bottom:2px}
.cal-cell{min-height:78px;border:1px solid var(--line-soft);border-radius:4px;background:var(--surface);padding:5px 6px;overflow:hidden}
.cal-cell.mut{background:transparent;border-color:transparent}

.cal-cell .cd{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--text-3)}

.cal-cell .cl{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.cal-cell .cl button{font:inherit;font-size:11px;text-align:left;color:var(--text-2);background:none;border:none;padding:2px 4px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal-cell .cl button:hover{background:var(--bg-2);color:var(--text)}
.cal-cell .cl button.done{text-decoration:line-through;color:var(--text-4)}
/* 月历拖拽：格子是落点，任务芯片可拖动 */
.cal-cell.dragover{border-color:var(--accent);background:var(--accent-soft)}
.cal-cell .cl button.dragging{opacity:.45}
.cal-cell .more{font-size:10.5px;color:var(--text-4)}
@media (max-width:860px){ .cal-cell{min-height:56px} .cal-cell .cl button{font-size:10px;padding:1px 2px} }
.heat{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;max-width:660px}
.heat .h{display:block;aspect-ratio:1;}







/* ================= 批量选择（列表视图） ================= */
.sel-chk{
  width:20px;height:20px;flex:0 0 20px;border:1.8px solid #bdd3d1;border-radius:5px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s;
}
.sel-chk:hover{border-color:var(--accent);background:var(--accent-soft2)}
.sel-chk.on{background:linear-gradient(180deg,#14a89b,#0a7268);border-color:#0a7268}
.sel-chk svg{width:12px;height:12px;color:#fff;opacity:0;stroke-width:3.6}
.sel-chk.on svg{opacity:1}
.item.sel{background:linear-gradient(90deg,rgba(14,139,128,.075),rgba(14,139,128,.02) 60%,transparent 88%);margin:0 -20px;padding-left:20px;padding-right:20px}
.item.sel::before{left:0}
/* 批量浮条：与番茄钟浮条同一套纸面语言，固定在底部 */
.batchbar{
  position:fixed;left:24px;bottom:24px;z-index:85;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  background:linear-gradient(180deg,#123f3a,#0a2b28);color:#fff;padding:10px 14px;border-radius:13px;
  box-shadow:0 12px 34px rgba(8,42,39,.32);font-size:13px;max-width:min(92vw,620px);
  animation:tin .28s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
.batchbar .bc{font-weight:650;flex:0 0 auto}
.batchbar .bc b{color:#7ceada;font-size:15px;font-variant-numeric:tabular-nums}
.batchbar select{
  font:inherit;font-size:12px;font-weight:600;color:#eaf6f4;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 8px;max-width:132px;
}
.batchbar select option{color:#123f3a;background:#fff}
.batchbar button{
  font:inherit;font-size:12px;font-weight:650;color:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 11px;flex:0 0 auto;
}
.batchbar button:hover{background:rgba(255,255,255,.12);color:#fff}
.batchbar button.danger{border-color:rgba(255,138,133,.5);color:#ffb4ae}
.batchbar button.danger:hover{background:rgba(255,110,100,.18)}
.batchbar .bx{margin-left:auto;color:rgba(255,255,255,.6);font-size:11.5px}
.batchbar.raised{bottom:92px}   /* 番茄钟浮条也在时，让位避免重叠 */
@media (max-width:860px){
  .batchbar{left:12px;right:12px;bottom:12px;max-width:none;gap:7px}
  .batchbar.raised{bottom:78px}
  .batchbar select{flex:1 1 96px;max-width:none}
  .batchbar .bx{display:none}
  .item.sel{margin:0 -15px;padding-left:15px;padding-right:15px}
}

/* ================= 看板卡片内的子任务 ================= */
.kb-subs{display:flex;flex-direction:column;gap:3px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.kb-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);text-align:left;width:100%}
.kb-sub .sc{
  width:15px;height:15px;flex:0 0 15px;border:1.5px solid #c8dad9;border-radius:4px;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s;
}
.kb-sub:hover .sc{border-color:var(--accent)}
.kb-sub .sc svg{width:9px;height:9px;color:var(--accent);opacity:0;stroke-width:3.6}
.kb-sub .sc.on{background:var(--accent-soft2);border-color:var(--accent)}
.kb-sub .sc.on svg{opacity:1}
.kb-sub .st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kb-sub.done .st{text-decoration:line-through;color:var(--text-4)}

/* ================= 复盘增强 ================= */
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:10px}
.cmp{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;background:var(--surface);
  box-shadow:var(--sh-1);
}
.cmp .cl{font-size:11.5px;color:var(--text-3);font-weight:650;letter-spacing:.3px}
.cmp .cv{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;color:var(--accent-deep);margin-top:3px}
.cmp .cd{font-size:11.5px;font-weight:700;margin-top:2px;color:var(--text-4)}
.cmp .cd.up{color:var(--accent)}
.cmp .cd.down{color:var(--warn)}
.streak{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.streak .sv{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--accent-deep);line-height:1.1}
.streak .sl{font-size:11.5px;color:var(--text-3);font-weight:650;letter-spacing:.3px;margin-left:5px}
.trend{width:100%;height:auto;display:block;overflow:visible}
.trend .gl{stroke:var(--line-soft);stroke-width:1}
.trend .ax{fill:var(--text-4);font-size:9.5px;font-weight:600}
.trend .ln{fill:none;stroke:url(#trendStroke);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.trend .ln2{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:4 3;opacity:.8;stroke-linejoin:round;stroke-linecap:round}
.trend .dot{fill:var(--surface);stroke:var(--accent);stroke-width:1.8}
.trend .dot.z{fill:var(--text-4);stroke:var(--text-4)}
html[data-theme=dark] .batchbar select option{color:#e8f2f1;background:#12332f}
html[data-theme=dark] .cmp .cv{color:#7ceada}
.heat-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--text-4)}
.memory{margin:-6px 0 18px;font-size:12.5px;font-family:var(--serif);letter-spacing:.3px}
.memory span{color:var(--text-4);margin-right:8px}

  .workspace-pulse{gap:7px}.pulse{min-height:70px;gap:8px}.pulse .pulse-icon{width:29px;height:29px;flex-basis:29px}.pulse .pulse-value{font-size:18px}.pulse .pulse-label{font-size:11px}.viewseg-wrap{top:0;margin-left:-14px;margin-right:-14px;padding:8px 14px}.it-act{opacity:1}.card-h h2::before{height:13px}
}
@media (max-width:480px){.workspace-pulse{grid-template-columns:1fr}.pulse{min-height:58px}.pulse .pulse-copy{grid-template-columns:auto 1fr;align-items:baseline;gap:7px}.pulse .pulse-label{white-space:normal}.topbar-act .btn{min-height:40px}}

/* =================================================================
   极简留白 · 最终视觉基调
   近白纸面 / 墨黑为唯一强调色 / 以留白代替分隔线 / 阴影近乎无形
   ================================================================= */
:root{
  --bg:#fafaf9; --bg-2:#f1f1ef; --surface:#ffffff; --line:#eaeae7; --line-soft:#f2f2ef;
  --text:#1d1d1f; --text-2:#6b6b68; --text-3:#9a9a96; --text-4:#c5c5c0;
  --accent:#1d1d1f; --accent-dark:#000; --accent-deep:#000; --accent-fg:#fff;
  --accent-soft:#f0efec; --accent-soft2:#f7f6f3;
  --cyan:#5c6b66;
  --danger:#a8453f; --danger-soft:#f8f0ef; --danger-line:#e6cfcc;
  --warn:#8a7340; --warn-line:#e3dbc6;
  --radius:10px; --radius-sm:8px; --radius-xs:6px;
  --sh-1:0 1px 2px rgba(20,20,19,.04);
  --sh-2:0 1px 3px rgba(20,20,19,.05),0 10px 26px rgba(20,20,19,.05);
  --sh-3:0 2px 6px rgba(20,20,19,.07),0 16px 36px rgba(20,20,19,.1);
  --sh-4:0 28px 68px rgba(20,20,19,.16);
}
body{background:var(--bg);background-image:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13.5px;line-height:1.75}
::selection{background:#e2e2de;color:var(--text)}
::-webkit-scrollbar-thumb{background:#dfdfdb;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#c9c9c5;background-clip:content-box}
:focus-visible{outline:2px solid var(--text-3);outline-offset:2px}

/* —— 版式骨架：更窄的版心、更宽的呼吸 —— */
.app{background:transparent}
.main{max-width:1060px;padding:46px 56px 110px}
.topbar{border-bottom:none;padding-bottom:0;margin-bottom:28px}
.topbar h1{font-family:inherit;font-size:24px;font-weight:620;letter-spacing:-.2px}
.card{border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--sh-1);margin-bottom:24px}
.card:hover{box-shadow:var(--sh-2);transform:none}
.card-h{background:transparent;border-bottom:none;padding:22px 28px 0}
.card-h > svg{color:var(--text-4)}
.card-h h2{font-weight:600}
.card-h h2::before{display:none}
.card-b{padding:20px 28px}
.card-b.tight{padding:10px 28px 20px}
.subbar{padding:12px 28px}
.dgroup-h{background:linear-gradient(180deg,var(--surface) 76%,rgba(255,255,255,0))}
.viewseg-wrap{background:linear-gradient(180deg,var(--bg) 76%,rgba(250,250,249,0))}

/* —— 侧栏：与纸面同色，只靠一条细线分隔 —— */
.nav{background:var(--surface);border-right:1px solid var(--line);padding:26px 14px 20px;box-shadow:none}
.nav::before{display:none}
.brand{border-bottom:none;padding-bottom:16px}
.brand-mark{background:var(--text);border-radius:7px;transform:none;box-shadow:none}
.brand-mark .seal-char{font-family:"Kaiti SC","KaiTi","STKaiti",serif;color:var(--accent-fg);text-shadow:none}
.brand-t{color:var(--text);font-family:inherit;letter-spacing:1.5px;font-weight:600}
.brand-s{color:var(--text-4)}
.nav-label{color:var(--text-4);padding:18px 12px 8px;letter-spacing:2px}
.nav-item{color:var(--text-2);font-weight:500}
.nav-item:hover{background:var(--bg-2);color:var(--text)}
.nav-item.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.nav-item.on::before{display:none}
.nav-item svg{color:var(--text-4)}
.nav-item:hover svg{color:var(--text-2)}
.nav-item.on svg{color:var(--accent-fg);opacity:.85}
.nav-count{background:transparent;border:1px solid var(--line);color:var(--text-3)}
.nav-item.on .nav-count{border-color:rgba(255,255,255,.3);color:var(--accent-fg);background:transparent}
.nav-count.hot{background:var(--danger);border-color:var(--danger);color:#fff}
.nav-foot{border-top:1px solid var(--line-soft);color:var(--text-4)}
.nav-foot b{color:var(--text-3)}
.lang-btn{border-color:var(--line);background:transparent;color:var(--text-3)}
.lang-btn:hover{border-color:var(--text-4);color:var(--text);background:transparent}
.nav-search{background:var(--bg-2);border-color:transparent;color:var(--text-3)}
.nav-search:hover{background:#ececea;border-color:transparent;color:var(--text)}
.nav-search .kbd{border-color:var(--line);color:var(--text-4)}
.nav-tab{background:var(--surface);border-color:var(--line);color:var(--text-3);box-shadow:2px 2px 8px rgba(20,20,19,.04)}
.nav-tab:hover{color:var(--text);border-color:var(--text-4)}

/* —— Hero：去框去影，只留字 —— */
.hero{border:none;box-shadow:none;background:transparent;min-height:0;margin-bottom:28px}
.hero-c{padding:26px 28px 26px 0}
.hero h1{font-family:inherit;font-size:27px;font-weight:650;letter-spacing:0;color:var(--text)}
.hero-eyebrow{color:var(--text-3);letter-spacing:2px}
.hero p{color:var(--text-2)}
.hero p b,.hero p .rd{font-weight:640}
.hero-hey{color:var(--text-3)}
.hero-motto{color:rgba(29,29,31,.26);letter-spacing:6px}

/* —— 按钮 / 表单 / 胶囊：墨黑为唯一强调 —— */
.btn{border-radius:var(--radius-sm);border-color:var(--line);background:var(--surface);color:var(--text-2);box-shadow:none;min-height:34px}
.btn:hover{border-color:var(--text-4);color:var(--text);box-shadow:none;transform:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--accent-fg)}
.btn-danger{color:var(--danger);border-color:var(--danger-line);background:var(--surface)}
.btn-danger:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
input[type=text],input[type=date],select,textarea{background:#fcfcfb;border-color:var(--line);border-radius:var(--radius-sm)}
input[type=text]:hover,input[type=date]:hover,select:hover,textarea:hover{border-color:#d8d8d4}
input:focus,select:focus,textarea:focus{border-color:var(--text-3);box-shadow:none;background:var(--surface)}
.f label{color:var(--text-4);letter-spacing:1px}
.pill{border:1px solid var(--line);background:transparent;box-shadow:none;color:var(--text-3);font-weight:550}
.pill.red,.p1{border-color:var(--danger-line);color:var(--danger)}
.pill.teal,.pill.cyan,.p3{border-color:var(--line);color:var(--text-2)}
.pill.warn,.p2{border-color:var(--warn-line);color:var(--warn)}
.pill.gray,.p4{border-color:var(--line);color:var(--text-4)}
.pill.proj-link{border-color:var(--line);color:var(--text-2)}
.pill.proj-link:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg{background:var(--bg-2);border:none;padding:3px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,20,19,.07)}
.tag-chip{border-radius:16px}
.tag-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:none}
.chk{border-color:#d6d6d2;border-radius:5px}
.chk:hover{border-color:var(--text-3);background:var(--surface);box-shadow:none}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{color:var(--accent-fg)}
.sub-chk{border-color:#d6d6d2}
.sub-chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pt-chk{border-color:#d6d6d2}
.ico-btn{color:var(--text-4)}
.ico-btn:hover{background:var(--bg-2);color:var(--text-2)}

/* —— 列表行：去发光，只留一点色线 —— */
.item{padding:15px 0}
.item::before{left:-28px}
.item.od{margin:0 -28px;padding:15px 28px;background:rgba(168,69,63,.035)}
.item.od .it-title{color:var(--danger)}
.item.pr1::before{background:var(--danger);box-shadow:none}
.item.pr2::before{background:var(--warn);box-shadow:none}
.item.pr3::before{background:var(--cyan);box-shadow:none}
.item.pr4::before{background:var(--line)}
.item.done::before{background:var(--line-soft)}
.it-title{font-weight:520}
.it-act{opacity:.55}
.item:hover .it-act,.item:focus-within .it-act{opacity:1}
.dot{box-shadow:none}
.allclear svg{color:var(--text-3)}

/* —— 第 24 轮 · 优先级三重编码：色（色条）+ 形（标记）+ 位（切换处留白） ——
   形状不依赖颜色，色弱与灰度打印下同样可读 */
.item::before{width:3px}
.pm{width:9px;height:9px;flex:0 0 9px;display:block}
.pm.p1{fill:var(--danger)}
.pm.p2{fill:none;stroke:var(--warn);stroke-width:1.5;stroke-linejoin:round}
.pm.p3{fill:none;stroke:var(--cyan);stroke-width:1.5}
.pm.p4{fill:none;stroke:var(--text-3);stroke-width:1.7;stroke-linecap:round}
.item.pr1:not(.sel):not(.od){background:rgba(168,69,63,.035)}
.item.pr1.od:not(.sel){background:rgba(168,69,63,.085)}
html[data-theme=dark] .item.pr1:not(.sel):not(.od){background:rgba(207,107,99,.055)}
html[data-theme=dark] .item.pr1.od:not(.sel){background:rgba(207,107,99,.1)}
.it-t{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:7px;min-width:0}
.it-t .it-title{min-width:0}
.it-t .pm{margin-top:5px}
.item.pr1 .it-title{font-weight:600}
.pr-sep{height:1px;background:var(--line-soft);margin:8px 0 2px}

/* —— 任务备注行 / 状态徽标 —— */
.it-note{display:flex;gap:6px;margin-top:3px;font-size:12px;color:var(--text-2);line-height:1.6}
.it-note svg{width:11px;height:11px;flex:0 0 11px;margin-top:5px;color:var(--text-4)}
.it-note span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-chip{font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.ts-chip.wait{background:var(--warn-line);color:var(--warn)}
.ts-chip.doing{background:var(--accent-soft);color:var(--text-2)}
.ts-chip.cancel{background:var(--bg-2);color:var(--text-3);text-decoration:line-through}
.item.cancel .it-title{color:var(--text-3);text-decoration:line-through}
.item.cancel::before{background:var(--line-soft)}
.kb-note{display:flex;gap:5px;margin-top:5px;font-size:11.5px;color:var(--text-2);line-height:1.55}
.kb-note svg{width:10px;height:10px;flex:0 0 10px;margin-top:4px;color:var(--text-4)}
.kb-card .kb-t{display:flex;align-items:flex-start;gap:5px}
.kb-card .kb-t .pm{margin-top:3px}
.kb-card .kb-t .t{flex:1 1 auto}

/* —— 今日负荷条 —— */
.load{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 24px 20px;box-shadow:var(--sh-1);margin-bottom:20px}
.load-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.load-t{font-size:14px;font-weight:650;color:var(--text)}
.load-s{font-size:12px;color:var(--text-3)}
.load-bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg-2)}
.load-bar span{display:block;height:100%}
.load-bar .lb-d{background:var(--cyan)}
.load-bar .lb-w{background:var(--warn);opacity:.55}
.load-bar .lb-o{background:var(--danger)}
.load-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--text-3)}
.load-legend .lg-o{color:var(--danger)}
.load-note{margin-top:12px;padding:10px 13px;background:var(--accent-soft2);border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-2);line-height:1.7}
.load-act{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

/* —— 复盘归因洞察 —— */
.ins{list-style:none;margin:0;padding:0}
.ins li{position:relative;padding:10px 0 10px 20px;font-size:13px;color:var(--text-2);line-height:1.75;border-bottom:1px dashed var(--line-soft)}
.ins li:last-child{border-bottom:none}
.ins li::before{content:"";position:absolute;left:3px;top:18px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.ins li b{font-weight:620;color:var(--text)}

/* —— 焦点 / 提醒：一面素纸，只留一点朱砂 —— */
.focus{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--sh-1)}
.focus-h{background:transparent;border-bottom:1px solid var(--line-soft);padding:18px 28px}
.focus-b{padding:4px 28px 18px}
.focus.clear,.focus.clear .focus-h{background:transparent;border-color:var(--line-soft)}
.mini-alert{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--danger);box-shadow:none}
.mini-alert .mt{color:var(--text-2)}
.nudge{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--warn);box-shadow:none}
.nudge .nt{color:var(--text-2)}
.conn-warn{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--danger);box-shadow:none}

/* —— 卡片家族：看板 / 便签 / 项目 / 统计 —— */
.kb-col,.mtx-q,.tl-col{background:transparent;border-color:var(--line)}
.kb-col.dragover,.mtx-q.dragover,.tl-col.dragover{border-color:var(--text-4);background:var(--bg-2)}
.kb-card{background:var(--surface);border-color:var(--line);box-shadow:none;border-radius:var(--radius-sm);position:relative}
.kb-card:hover{border-color:var(--text-4);box-shadow:none;transform:none}
.kb-card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.kb-card .t{padding-right:24px}
.kb-done{position:absolute;top:7px;right:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-4);opacity:0;transition:.15s;background:transparent}
.kb-card:hover .kb-done,.kb-card .kb-done:focus-visible{opacity:1}
.kb-done svg{width:13px;height:13px}
.kb-done:hover{color:var(--accent-dark);background:var(--accent-soft)}
@media (max-width:860px){.kb-done{opacity:.65}}
.notes{gap:16px}
.note{background:var(--surface);border-color:var(--line);border-radius:var(--radius-sm);box-shadow:var(--sh-1)}
.note::after{display:none}
.note p{font-family:inherit;color:var(--text)}
.notes .note:nth-child(4n+1),.notes .note:nth-child(4n+2),.notes .note:nth-child(4n+3),.notes .note:nth-child(4n){transform:none;background:var(--surface)}
.notes .note:hover{transform:none;border-color:var(--text-4);box-shadow:var(--sh-1)}
.projs{gap:16px}
.proj{border-radius:var(--radius-sm);box-shadow:var(--sh-1)}
.proj::after{display:none}
.proj:hover{box-shadow:var(--sh-2);transform:none}
.proj.blocked{border-color:var(--danger-line)}
.stat{background:var(--surface);border-color:var(--line);border-radius:var(--radius-sm);box-shadow:var(--sh-1)}
.stat:hover{box-shadow:var(--sh-1);transform:none}
.stat .n{font-family:inherit;font-size:28px;font-weight:620;color:var(--text)}
.stat.red .n{color:var(--danger)}
.bk{background:var(--surface);border-color:var(--line);border-radius:var(--radius-sm)}
.bk h3 svg{color:var(--text-3)}
.pt-bar{background:var(--bg-2)}
.pt-fill{background:var(--text-3)}
.pt-fill.full{background:var(--text)}
.pt-done svg{color:var(--text-3)}
.cal-cell{border-color:var(--line-soft)}
.cal-cell.today{border-color:var(--text-3)}
.cal-cell.today .cd{color:var(--text)}
.heat .h{background:var(--bg-2);border-radius:1px}
.heat .h1{background:#dcdcd8}
.heat .h2{background:#a3a3a0}
.heat .h3{background:var(--text)}
.memory{color:var(--text-3)}

/* —— 首屏三格摘要：去卡片化，一行分栏 —— */
.workspace-pulse{border-top:1px solid var(--line-soft)}
.pulse{background:transparent;border:none;border-right:1px solid var(--line-soft);border-radius:0;padding:16px 22px;gap:10px}
.pulse:last-child{border-right:none}
.pulse:hover{background:var(--bg-2);border-color:var(--line-soft);box-shadow:none;transform:none}
.pulse .pulse-icon{background:transparent;color:var(--text-3);width:26px;height:26px;flex:0 0 26px}
.pulse .pulse-value{font-size:24px;font-weight:620}
.pulse.danger{border-color:var(--line-soft)}
.pulse.danger .pulse-icon{background:transparent;color:var(--danger)}
.pulse.danger .pulse-value{color:var(--danger)}
.pulse.info .pulse-icon{background:transparent;color:var(--text-2)}

/* —— 今日签 / 今日一笔 —— */

/* 深浅色：先于任何渲染应用，避免首帧闪白。手动偏好存 localStorage，未设置时跟随系统 */
try {
  const _th = localStorage.getItem('pd_wb_theme');
  if (_th === 'dark' || (_th === null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
    document.documentElement.dataset.theme = 'dark';
} catch (e) {}
/* 移动端状态栏配色跟随深浅色（浅 #fafaf9 / 深 #141413） */
function setThemeColor() {
  const m = document.getElementById('themeColorMeta');
  if (m) m.content = document.documentElement.dataset.theme === 'dark' ? '#141413' : '#fafaf9';
}
setThemeColor();
function toggleTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  if (dark) document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = 'dark';
  try { localStorage.setItem('pd_wb_theme', dark ? 'light' : 'dark'); } catch (e) {}
  setThemeColor();
  render();
}

const ds = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const TODAY = () => ds(new Date());
const shift = (base, n) => { const d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + n); return ds(d); };
const dayDiff = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 864e5);
const WD = I18N[LANG].wd;
const human = s => {
  if (!s) return T('dNoDeadline');
  const t = TODAY(), n = dayDiff(t, s);
  if (n === 0) return T('dToday');
  if (n === 1) return T('dTomorrow');
  if (n === -1) return T('dYesterday');
  if (n < 0) return T('dOverdueN', -n);
  if (n <= 6) return T('dInDays', WD[new Date(s+'T00:00:00').getDay()], n);
  return s.slice(5).replace('-', '/');
};
const clock = ts => {
  const d = new Date(ts), t = TODAY(), n = dayDiff(ds(d), t);
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (n === 0) return T('tToday', hm);
  if (n === 1) return T('tYesterday', hm);
  return `${d.getMonth()+1}/${d.getDate()} ${hm}`;
};
/* 周一为一周起点 */
const weekStart = (base, offset = 0) => {
  const d = new Date(base + 'T00:00:00');

  d.setDate(d.getDate() - k + offset * 7);
  return ds(d);
};

/* ---------- 回收站：删除可恢复 ----------
   墓碑（tomb）只记 id，用于同步时防止旧副本复活已删记录；
   回收站（bin）存整条记录的快照，用于「手滑删了还能拿回来」。两者分工明确。
   kind: task / note / proj；idx 是删除时所在下标（恢复时插回原位）；
   pids 仅项目用：删除时被解绑的关联待办 id，恢复时重新挂回去。 */
const BIN_KEEP = 30 * 864e5, BIN_MAX = 200;
const BIN_ARR = { task: 'tasks', note: 'notes', proj: 'projects' };
function binTrim() {
  if (!Array.isArray(S.bin)) S.bin = [];
  const cut = Date.now() - BIN_KEEP;
  S.bin = S.bin.filter(x => x && x.rec && Number(x.at) > cut).slice(0, BIN_MAX);
}
function binAdd(kind, rec, extra) {
  if (!rec || !S) return;
  if (!Array.isArray(S.bin)) S.bin = [];
  S.bin.unshift(Object.assign({ id: rec.id, kind, rec, at: Date.now() }, extra || {}));
  binTrim();
}
/* 恢复：取出快照 → 撤销墓碑 → 插回原下标。项目还会把当初解绑的待办重新挂上 */
function binRestore(bid) {
  if (!Array.isArray(S.bin)) return null;
  const i = S.bin.findIndex(x => x && x.id === bid);
  if (i < 0) return null;
  const e = S.bin.splice(i, 1)[0];
  delete S.tomb[bid];                      // 撤销墓碑，否则后续同步/合并会把它再删一次
  const arr = BIN_ARR[e.kind];
  if (!arr || !e.rec) return null;
  const at = Math.min(Number(e.idx) || 0, S[arr].length);
  S[arr].splice(at, 0, e.rec);
  if (e.kind === 'proj' && Array.isArray(e.pids)) {
    S.tasks.forEach(k => { if (e.pids.indexOf(k.id) >= 0) { k.pid = bid; k.updatedAt = Date.now(); } });
  }
  return e;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) { S = blank(); seed(); normalize(); save(); return; }
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object') throw new Error('invalid data');
    S = Object.assign(blank(), d);
    S.meta = Object.assign(blank().meta, d.meta || {});
    ['tasks','notes','projects'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
    normalize();
  } catch (e) {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) localStorage.setItem(KEY + '_corrupt_' + Date.now(), raw);
    } catch (ignore) {}
    S = blank(); seed(); normalize();
    toast(T('tLoadFail'), true);
  }
}
/* 数据兼容：补齐字段、清理指向已删项目的悬空引用 */
function normalize() {
  if (!S.meta || typeof S.meta !== 'object') S.meta = blank().meta;
  /* 每日番茄账本：老数据补空表，保证复盘页按周期统计不报错 */
  if (!S.meta.pomoLog || typeof S.meta.pomoLog !== 'object' || Array.isArray(S.meta.pomoLog)) S.meta.pomoLog = {};
  /* 多端同步：墓碑与日记时间戳补齐；墓碑保留 90 天，过期自清 */
  if (!S.tomb || typeof S.tomb !== 'object' || Array.isArray(S.tomb)) S.tomb = {};
  if (!S.diaryTs || typeof S.diaryTs !== 'object' || Array.isArray(S.diaryTs)) S.diaryTs = {};
  /* 回收站：老数据补空数组；过期（>30 天）与超量（>200）自动清理 */
  if (!Array.isArray(S.bin)) S.bin = [];
  binTrim();
  const tombCut = Date.now() - 90 * 864e5;
  Object.keys(S.tomb).forEach(id => { if (Number(S.tomb[id]) && Number(S.tomb[id]) < tombCut) delete S.tomb[id]; });
  S.projects = (Array.isArray(S.projects) ? S.projects : []).filter(p => p && typeof p === 'object').map(p => ({
    id: String(p.id || uid()), name: String(p.name || '').trim(), stage: String(p.stage || ''),
    next: String(p.next || ''), blocker: String(p.blocker || ''),
    status: ['active', 'blocked', 'done'].includes(p.status) ? p.status : 'active',
    updatedAt: Number(p.updatedAt) || Date.now()
  }));
  const ids = new Set(S.projects.map(p => p.id));
  S.tasks.forEach(k => {
    if (!k || typeof k !== 'object') return;
    delete k._open;   // 历史遗留：展开态曾被写在任务上，会污染导出/同步文件，读到即清除
    k.id = String(k.id || uid());
    k.title = String(k.title || '').trim();
    k.prio = [1, 2, 3, 4].includes(Number(k.prio)) ? Number(k.prio) : 3;
    k.done = !!k.done;
    k.createdAt = Number(k.createdAt) || Date.now();
    k.updatedAt = Number(k.updatedAt) || Number(k.doneAt) || Number(k.createdAt) || Date.now();
    if (k.doneAt != null) k.doneAt = Number(k.doneAt) || null;
    k.due = /^\d{4}-\d{2}-\d{2}$/.test(String(k.due || '')) ? String(k.due) : '';
    /* 开始日期（起止任务）：老数据无此字段补空，非法值清空 */
    if (k.start === undefined) k.start = '';
    else k.start = /^\d{4}-\d{2}-\d{2}$/.test(String(k.start || '')) ? String(k.start) : '';
    if (k.pid === undefined) k.pid = '';
    if (k.pid && !ids.has(k.pid)) k.pid = '';   // 项目已删，任务保留但解绑
    if (k.rolls === undefined) k.rolls = 0;
    if (k.repeat === undefined) k.repeat = '';
    if (!k.pomo) k.pomo = 0;
    if (!Array.isArray(k.subs)) k.subs = [];
    if (!Array.isArray(k.tags)) k.tags = [];
    k.tags = k.tags.map(x => String(x).trim()).filter(Boolean).slice(0, 12);
    k.link = String(k.link || '').trim().slice(0, 2048);
    /* 备注 / 状态 / 预估（第 24 轮新增，老数据与对端同步文件都没有，读到即补默认值） */
    k.note = String(k.note || '').trim().slice(0, 2000);
    k.status = ['todo', 'doing', 'wait', 'cancel'].includes(k.status) ? k.status : 'todo';
    k.est = Math.max(0, Math.min(20, Math.round(Number(k.est) || 0)));
  });
  S.tasks = S.tasks.filter(k => k && typeof k === 'object' && k.title);
  S.notes = (Array.isArray(S.notes) ? S.notes : []).filter(n => n && typeof n === 'object' && String(n.text || '').trim())
    .map(n => ({ id: String(n.id || uid()), text: String(n.text).trim().slice(0, 1200),
      tags: Array.isArray(n.tags) ? n.tags.map(x => String(x).trim()).filter(Boolean).slice(0, 12) : [],
      createdAt: Number(n.createdAt) || Date.now(),
      updatedAt: Number(n.updatedAt) || Number(n.createdAt) || Date.now() }));
  if (!S.diary || typeof S.diary !== 'object' || Array.isArray(S.diary)) S.diary = {};
}

/* ---------- 多端同步：按记录合并（纯函数，可单测） ----------
   一期方案（云盘同步目录 + 启动合并）核心规则：
   1) 按 id 取并集；同一 id 冲突按 updatedAt 取新（平局取本地）；
   2) 删除记墓碑 tomb[id]=删除时间：tomb ≥ 记录的 updatedAt 时该记录视为已删（防复活）；
      若记录的编辑晚于墓碑时间 → 复活合法，墓碑随即撤销；
   3) 示例数据（_s 标记）：任一侧已有真实数据时剔除对侧示例，避免两台新设备互相污染；
   4) 墓碑保留 90 天，过期自清。 */
function mergeKindList(lArr, rArr) {
  if (!Array.isArray(lArr)) lArr = [];
  if (!Array.isArray(rArr)) rArr = [];
  const lReal = lArr.some(x => !x._s), rReal = rArr.some(x => !x._s);
  let l = lArr, r = rArr;
  if (lReal && !rReal) r = [];
  else if (rReal && !lReal) l = [];
  else if (lReal && rReal) { l = l.filter(x => !x._s); r = r.filter(x => !x._s); }
  return { l, r };
}
function mergeData(local, remote) {
  const out = { tasks: [], notes: [], projects: [], tomb: {} };
  const cut = Date.now() - 90 * 864e5;
  const tomb = Object.assign({}, local.tomb || {}, remote.tomb || {});
  Object.keys(tomb).forEach(id => { if (Number(tomb[id]) && Number(tomb[id]) < cut) delete tomb[id]; });
  (['tasks', 'notes', 'projects']).forEach(kind => {
    const { l, r } = mergeKindList(local[kind] || [], remote[kind] || []);
    const lm = new Map(), rm = new Map();
    l.forEach(x => { if (x && x.id != null) lm.set(String(x.id), x); });
    r.forEach(x => { if (x && x.id != null) rm.set(String(x.id), x); });
    const ids = new Set([...lm.keys(), ...rm.keys()]);
    ids.forEach(id => {
      const lx = lm.get(id), rx = rm.get(id);
      const lT = lx ? (Number(lx.updatedAt) || 0) : 0;
      const rT = rx ? (Number(rx.updatedAt) || 0) : 0;
      const dT = Number(tomb[id]) || 0;
      if (dT && dT >= Math.max(lT, rT)) return;   // 删除仍然有效（或副本更旧）→ 两侧都不保留
      if (dT) delete tomb[id];                     // 删除被更新的编辑推翻 → 复活并撤销墓碑
      if (!lx) { out[kind].push(rx); return; }
      if (!rx) { out[kind].push(lx); return; }
      out[kind].push(lT >= rT ? lx : rx);          // LWW：取更新时间更新的记录，平局取本地
    });
  });
  out.tomb = tomb;
  return out;
}
/* 今日一笔：按写入时间戳取新；两端都没有时间戳（老数据）时平局取本地 */
function mergeDiary(localD, localTs, remoteD, remoteTs) {
  const out = {}, ts = Object.assign({}, localTs || {}, remoteTs || {});
  const dates = new Set([...Object.keys(localD || {}), ...Object.keys(remoteD || {})]);
  dates.forEach(d => {
    const l = localD[d], r = remoteD[d];
    if (l === undefined) { out[d] = r; return; }
    if (r === undefined) { out[d] = l; return; }
    const lt = Number(localTs && localTs[d]) || 0, rt = Number(remoteTs && remoteTs[d]) || 0;
    if (lt >= rt) { out[d] = l; ts[d] = lt; } else { out[d] = r; ts[d] = rt; }
  });
  return { diary: out, diaryTs: ts };
}
/* 元数据：每日番茄账本按天取大（两台设备各自计数，取大不重复）；
   sample 仅当两侧都是示例才为真；其余字段是设备本地状态，保留本地 */
function mergeMeta(local, remote) {
  const lm = local.meta || {}, rm = remote.meta || {};
  const pomoLog = Object.assign({}, lm.pomoLog || {});
  Object.entries(rm.pomoLog || {}).forEach(([d, c]) => {
    pomoLog[d] = Math.max(Number(pomoLog[d]) || 0, Number(c) || 0);
  });
  return Object.assign({}, lm, { pomoLog, sample: !!(lm.sample && rm.sample) });
}
let saveTimer = null;
function save(instant) {
  const write = () => {
    S.meta.lastChange = Date.now();   // 多端同步：记录本地最近改动，供「云盘未就绪」提醒比对
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast(T('tSaveFail'), true); }
    FileStore.write();   // 已连接本地文件夹时，自动写入 workbench-data.json
  };
  if (instant) { clearTimeout(saveTimer); write(); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(write, 220);
}

/* ---------- 本地文件夹存储（File System Access API） ----------
   用户选择一个文件夹后，句柄存入 IndexedDB（跨会话保留），
   每次修改自动把全量数据写入该文件夹下的 workbench-data.json。
   localStorage 始终同步镜像一份，作为文件写入失败时的兜底。 */
const FileStore = (() => {
  const DB = 'pd_wb_fs', ST = 'handles', HK = 'dir', FILE = 'workbench-data.json';
  let dir = null, denied = false, writing = false, pending = false, stale = false, conflictNames = [];
  /* maharness 联动补丁：lastSeenSaved 记录本端最近一次见到/写入的 savedAt，
     轮询与写前合并据此识别「文件被 maharness 桥侧（Agent 工具）更新过」 */
  let lastSeenSaved = '';
  const supported = () => typeof window.showDirectoryPicker === 'function';
  const active = () => !!dir && !denied;

  function idb(mode, fn) {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(ST)) r.result.createObjectStore(ST); };
      r.onerror = () => rej(r.error);
      r.onsuccess = () => {
        const tx = r.result.transaction(ST, mode), st = tx.objectStore(ST);
        let out; try { out = fn(st); } catch (e) { rej(e); return; }
        tx.oncomplete = () => res(out ? out.result : undefined);
        tx.onerror = () => rej(tx.error);
      };
    });
  }
  const putHandle = h => idb('readwrite', st => st.put(h, HK));
  const getHandle = () => idb('readonly', st => st.get(HK));
  const delHandle = () => idb('readwrite', st => st.delete(HK));

  async function ensurePerm(h, ask) {
    try {
      let p = await h.queryPermission({ mode: 'readwrite' });
      if (p === 'granted') return true;
      if (!ask) return false;
      p = await h.requestPermission({ mode: 'readwrite' });
      return p === 'granted';
    } catch (e) { return false; }
  }

  async function writeNow() {
    /* maharness 联动补丁（写前吸收）：桥侧（Agent 工具）可能刚改过桥文件——
       先按记录合并进本地再写，保证「读-并-写」次序，任何一方都不覆盖对方改动 */
    try { await bridgeAbsorb(); } catch (e) {}
    const payload = { v: 1, app: 'workbench', savedAt: new Date().toISOString(),
                      tasks: S.tasks, notes: S.notes, projects: S.projects, diary: S.diary,
                      tomb: S.tomb, diaryTs: S.diaryTs, bin: S.bin, meta: S.meta };
    const fh = await dir.getFileHandle(FILE, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(payload, null, 2));
    await w.close();
    lastSeenSaved = payload.savedAt;   // 联动补丁：记录自己写的时间戳，轮询不会把自己的写入当外部改动
    snapshot(payload);
    stale = false;   // 刚写入成功，暂不提示云盘未就绪
  }
  /* 每日快照：每天首次写入时在 backups/ 下留一份 workbench-YYYY-MM-DD.json，保留最近 7 份 */
  async function snapshot(payload) {
    const today = ds(new Date());
    if (S.meta.autoBackup === today) return;
    try {
      const bdir = await dir.getDirectoryHandle('backups', { create: true });
      const fh = await bdir.getFileHandle(`workbench-${today}.json`, { create: true });
      const w = await fh.createWritable(); await w.write(JSON.stringify(payload, null, 2)); await w.close();
      const names = [];
      for await (const name of bdir.keys()) {
        if (/^workbench-\d{4}-\d{2}-\d{2}\.json$/.test(name)) names.push(name);
      }
      names.sort();
      while (names.length > 7) await bdir.removeEntry(names.shift());
      S.meta.autoBackup = today;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    } catch (e) {}
  }
  /* 挂起式写入：写完一轮后若期间又有新修改，再补写一轮。
     写失败（授权过期/文件夹被移走）→ 标记断连，弹提示，暂停后续写入 */
  function write() {
    if (!active()) return;
    if (writing) { pending = true; return; }
    writing = true;
    writeNow().catch(() => { denied = true; connLost(); }).finally(() => {
      writing = false;
      if (pending) { pending = false; write(); }
    });
  }
  function connLost() {
    toast(T('tConnLost'), true);
    try { renderConn(); } catch (e) {}
  }

  /* 启动合并（多端同步一期）：把文件数据按记录合并进本地，而不是整文件覆盖。
     合并完立即写回文件与本地镜像；文件不存在或损坏时把当前数据写入文件。
     同时评估「云盘未就绪」：文件 savedAt 距今超 24h 且本地在其后有改动 → 提示检查云盘 */
  async function mergeFromFile() {
    try {
      const fh = await dir.getFileHandle(FILE, { create: false });
      const d = JSON.parse(await (await fh.getFile()).text());
      if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.notes) || !Array.isArray(d.projects)) throw new Error('bad file');
      const m = mergeData(S, d);
      const md = mergeDiary(S.diary, S.diaryTs, d.diary, d.diaryTs);
      S.tasks = m.tasks; S.notes = m.notes; S.projects = m.projects; S.tomb = m.tomb;
      S.diary = md.diary; S.diaryTs = md.diaryTs;
      S.meta = mergeMeta(S, d);
      normalize();
      lastSeenSaved = d.savedAt || '';   // 联动补丁：启动/手动合并后记住文件版本
      const ft = d.savedAt ? new Date(d.savedAt).getTime() : 0;
      stale = !!(ft && Date.now() - ft > 24 * 36e5 && ((S.meta.lastChange || 0) - ft > 36e5));
      save(true);   // 合并完立即写回本地镜像与文件（幂等）
      return true;
    } catch (e) {
      try { await writeNow(); } catch (e2) {}
      return false;
    }
  }

  /* 冲突副本扫描：一次云盘断连两端同时保存，云盘客户端会生成副本文件 */
  async function scanConflicts() {
    conflictNames = [];
    try {
      for await (const name of dir.keys()) {
        if (/\.json$/i.test(name) && name !== FILE &&
            /conflict|conflicted|conflicts|冲突|副本|copy|\(1\)|\(2\)/i.test(name)) conflictNames.push(name);
      }
    } catch (e) {}
  }
  /* 读取冲突副本内容（供「合并导入」使用） */
  async function openConflict(name) {
    try {
      const fh = await dir.getFileHandle(name, { create: false });
      const d = JSON.parse(await (await fh.getFile()).text());
      return (d && Array.isArray(d.tasks)) ? d : null;
    } catch (e) { return null; }
  }

  /* 启动：恢复句柄 → 校验权限 → 按记录合并文件数据 → 扫描冲突副本。
     返回 'ok'|'need-perm'|'unsupported'|'' */
  async function init() {
    if (!supported()) return 'unsupported';
    let h = null;
    try { h = await getHandle(); } catch (e) {}
    if (!h) return '';
    dir = h; denied = true;
    if (!await ensurePerm(h, false)) return 'need-perm';
    denied = false;
    await mergeFromFile();
    await scanConflicts();
    return 'ok';
  }

  async function pick() {
    if (!supported()) { toast(T('tFolderFail'), true); return; }
    let h;
    try { h = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { if (e && e.name !== 'AbortError') toast(T('tFolderFail'), true); return; }
    if (!h) return;
    dir = h; denied = false;
    try { await putHandle(h); } catch (e) {}
    /* 与启动合并同一语义：文件夹里已有数据则按记录合并（而非整文件覆盖），
       避免换设备/换目录时把已有工作冲掉 */
    await mergeFromFile();
    render(); toast(T('tFolderPicked', h.name));
  }
  async function disconnect() {
    dir = null; denied = false;
    try { await delHandle(); } catch (e) {}
    render(); toast(T('tFolderOff'));
  }
  /* 断连后重新授权：把浏览器里最新的数据整体补写进文件夹。
     注意不从文件读回——断连期间的本地修改比文件新，回读会丢改动 */
  async function reconnect() {
    if (!dir) return;
    if (!await ensurePerm(dir, true)) { toast(T('tFolderFail'), true); return; }
    denied = false;
    try { await writeNow(); } catch (e) { denied = true; toast(T('tFolderFail'), true); return; }
    try { await snapshot({ tasks: S.tasks, notes: S.notes, projects: S.projects, diary: S.diary, meta: S.meta }); } catch (e) {}
    render();
    toast(T('tConnBack'));
  }
  /* 测试/演示钩子：模拟断连 */
  function _lose() { denied = true; connLost(); }

  /* ===== maharness 联动补丁（写前吸收 + 轮询吸收） =====
     maharness 工作台插件（Agent 工具）与本应用通过桥文件夹里的 workbench-data.json 共享数据。
     bridgeAbsorb：发现文件 savedAt 与本地已知不同（= 被桥侧更新过）→ 按记录合并进本地。
     调用时机：① writeNow 写文件前（「读-并-写」次序，杜绝互相覆盖）；
              ② 轮询（下方 setInterval）——Agent 写入后数秒内自动吸收，无需刷新页面。
     合并语义与启动合并完全一致（mergeData/mergeDiary/mergeMeta + normalize）。 */
  async function bridgeAbsorb() {
    if (!dir || denied) return false;
    const fh = await dir.getFileHandle(FILE, { create: false });
    const d = JSON.parse(await (await fh.getFile()).text());
    if (!d || !Array.isArray(d.tasks)) return false;
    if (!d.savedAt || d.savedAt === lastSeenSaved) return false;
    const m = mergeData(S, d);
    const md = mergeDiary(S.diary, S.diaryTs, d.diary, d.diaryTs);
    S.tasks = m.tasks; S.notes = m.notes; S.projects = m.projects; S.tomb = m.tomb;
    S.diary = md.diary; S.diaryTs = md.diaryTs;
    S.meta = mergeMeta(S, d);
    normalize();
    lastSeenSaved = d.savedAt;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    return true;
  }
  setInterval(() => {
    if (!active() || writing || document.hidden) return;
    bridgeAbsorb().then((merged) => {
      /* 有外部改动才重渲染；输入焦点在表单上时跳过本轮渲染（innerHTML 重建会打断输入） */
      if (!merged) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
      try { render(); } catch (e) {}
    }).catch(() => {});
  }, 4000);

  return { supported, active, denied: () => denied, name: () => dir ? dir.name : '', init, write, pick, disconnect, reconnect, _lose,
           staleOf: () => stale, conflicts: () => conflictNames.slice(), clearConflicts: () => { conflictNames = []; }, openConflict };
})();
const total = () => S.tasks.length + S.notes.length + S.projects.length;
const unexported = () => Math.max(0, total() - (S.meta.itemsAtExport || 0));
