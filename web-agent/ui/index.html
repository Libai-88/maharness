<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maharness — 你的 AI 小助手</title>
    <meta name="description" content="maharness——会学习、会记忆、会自己写插件的 AI Agent。文件读写、命令执行、联网搜索，说一声就好。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="maharness — 你的 AI 小助手" />
    <meta property="og:description" content="会学习、会记忆、会自己写插件的 AI Agent。文件读写、命令执行、联网搜索，说一声就好。" />
    <meta name="theme-color" content="#f7f7f5" />
    <!-- favicon 由 src/brand/favicon.ts 在首帧按主题写入；此处仅留占位，避免 404 图标。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3C/svg%3E" />
    <script>
      // 首帧主题预置（避免深/浅色闪烁）；未显式选择过时跟随系统
      (function () {
        var t = null;
        try { t = localStorage.getItem('maharness-theme'); } catch (e) { t = null; }
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
