name: E2E

# 每次推送（任意分支）自动跑微信式气泡/引用/输入区 9 条冒烟用例；可手动触发
on:
  push:
  workflow_dispatch:

# 同一 ref（分支）只跑最新一次：新 push 自动取消还在跑的旧 E2E
concurrency:
  group: e2e-${{ github.workflow_ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web-agent

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-agent/package-lock.json
            web-agent/ui/package-lock.json

      - name: 安装后端依赖
        run: npm ci

      - name: 安装前端依赖
        run: npm ci --prefix ui

      - name: 构建前端（E2E webServer 托管 ui/dist）
        run: npm run ui:build

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-agent/ui/package-lock.json') }}

      - name: 安装 Playwright Chromium（含系统依赖）
        run: npx playwright install --with-deps chromium
        working-directory: web-agent/ui

      - name: 运行 E2E 冒烟（9 条；webServer 自动拉起后端，chat 接口已 mock，无需 API Key）
        run: npm --prefix ui run e2e

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-agent/ui/playwright-report/
            web-agent/ui/test-results/
          retention-days: 7

  # 思考分流真机回归：注册临时 provider → 发消息 → 五项断言（SSE 思考非空 /
  # 正文非空 / 思考先于正文 / content 不含 reasoning 片段 / 落库 reasoning 分离）
  # 需要真实 LLM：走免费网关（newapi），密钥经 repo secret NEWAPI_API_KEY 提供
  reasoning-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-agent/package-lock.json

      - name: 安装依赖（后端）
        run: npm ci

      - name: 启动后端（独立临时数据目录）
        run: |
          export AGENT_DATA_DIR=$(mktemp -d)
          npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000 > /dev/null || { echo '后端启动失败'; cat /tmp/server.log; exit 1; }

      - name: 运行思考分流真机回归（R1 + Qwen 思考系）
        env:
          NEWAPI_API_KEY: ${{ secrets.NEWAPI_API_KEY }}
        run: node --import tsx scripts/regress-reasoning.ts
